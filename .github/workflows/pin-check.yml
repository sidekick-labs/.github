name: Pin Check

# Reusable PR gate that FAILS when a third-party GitHub Action isn't SHA-pinned.
# Four independent checks, both org-agnostic (everything derives from the caller):
#
#   1. zizmor (primary) — the GitHub Actions security auditor. We run its full
#      audit for visibility, but BLOCK only on the `unpinned-uses` finding so the
#      gate is specifically an actions-pinning gate (other zizmor findings are
#      surfaced as informational log, not merge blockers). First-party org
#      actions pinned at @main/@vN are allowed via the `unpinned-uses` policy:
#      the repo's `.github/zizmor.yml` if present, else an owner-scoped policy
#      synthesized from `github.repository_owner` (portable across every org).
#
#   2. pinact --check (secondary) — a tight, config-aware second opinion. It runs
#      against a RUNTIME-SYNTHESIZED `/tmp/pinact.yaml` built from the caller's
#      owner (first-party + local ignores + the anthropics/claude-code-action
#      semver-comment exemption) — it deliberately does NOT rely on any committed
#      `.pinact.yaml`, so the gate behaves identically on every repo regardless of
#      whether one is checked in.
#
#
#   3. pin integrity (third) — resolves every third-party pin against the action's
#      own repository. The first two checks only prove a ref is SHAPED like a
#      commit SHA; neither resolves it, so a well-formed pin to a SHA that does
#      not exist upstream passes both and then fails at run time, on whichever
#      path uses it. Blocks when the SHA is not any object in that repo; warns
#      when it is an annotated tag OBJECT rather than a commit, or when the
#      `# vX.Y.Z` label disagrees with the tag upstream (expected for a moving
#      tag that has advanced past the pinned commit).
#
#   4. workflow_run chain integrity (fourth) — asserts every `workflow_run`
#      listener in the repo names a workflow that actually exists there. The
#      deploy -> triage -> smoke chains are wired by exact `name:` strings, and a
#      listener naming a missing workflow is not an error to GitHub: it simply
#      never fires. A rename therefore severs the chain silently while every run
#      stays green. Offline and repo-local — no API calls.
# Consume from a PR workflow:
#
#   jobs:
#     pin-check:
#       uses: sidekick-labs/.github/.github/workflows/pin-check.yml@main
#
# The reusable is org-agnostic — it derives everything from the caller's repo.

on:
  workflow_call:
    inputs:
      zizmor-version:
        description: 'zizmor version to install (pinned for determinism).'
        type: string
        default: '1.26.1'
      paths:
        description: 'Space-separated paths to audit. Empty = auto-detect .github/workflows + .github/actions.'
        type: string
        default: ''

permissions: {}

env:
  PINACT_VERSION: '4.1.0'
  PINACT_SHA256: '8fcbf1b3e95551c82fd995535e3c1defa70e23299ce36eb3afd6c98778de6ca0'

jobs:
  pin-check:
    name: Actions pinning gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve audit paths + zizmor config
        id: prep
        env:
          INPUT_PATHS: ${{ inputs.paths }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PATHS}" ]; then
            PATHS="${INPUT_PATHS}"
          else
            PATHS=""
            [ -d .github/workflows ] && PATHS="${PATHS} .github/workflows"
            [ -d .github/actions ] && PATHS="${PATHS} .github/actions"
          fi
          PATHS="$(echo "${PATHS}" | xargs || true)"
          echo "paths=${PATHS}" >> "$GITHUB_OUTPUT"

          # Prefer the repo's own zizmor config; else synthesize an owner-scoped
          # policy so first-party @main/@vN refs are allowed but every third-party
          # action must be hash-pinned. This keeps the gate portable to any org.
          if [ -f .github/zizmor.yml ] || [ -f .github/zizmor.yaml ] || [ -f zizmor.yml ] || [ -f zizmor.yaml ]; then
            echo "config=" >> "$GITHUB_OUTPUT"
            echo "Using the repo's own zizmor config."
          else
            cat > "${RUNNER_TEMP}/zizmor.generated.yml" <<EOF
          rules:
            unpinned-uses:
              config:
                policies:
                  ${OWNER}/*: ref-pin
                  "*": hash-pin
          EOF
            echo "config=--config ${RUNNER_TEMP}/zizmor.generated.yml" >> "$GITHUB_OUTPUT"
            echo "No repo zizmor config — synthesized owner policy: ${OWNER}/* ref-pin, * hash-pin."
          fi

          if [ -z "${PATHS}" ]; then
            echo "::notice::No .github/workflows or .github/actions to audit — pin gate is a no-op."
          fi

      - name: Install zizmor
        if: steps.prep.outputs.paths != ''
        env:
          ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: zizmor — full audit (informational, non-blocking)
        if: steps.prep.outputs.paths != ''
        continue-on-error: true
        env:
          CONFIG: ${{ steps.prep.outputs.config }}
          PATHS: ${{ steps.prep.outputs.paths }}
        # $CONFIG / $PATHS are intentionally unquoted: CONFIG is a "--config <path>"
        # word pair and PATHS is space-separated. Routing them through env (rather
        # than templating step outputs straight into the shell) removes the
        # script-injection surface; env expansion only word-splits, never executes.
        run: zizmor --persona pedantic $CONFIG $PATHS

      - name: zizmor — pinning gate (blocks on unpinned-uses)
        if: steps.prep.outputs.paths != ''
        env:
          CONFIG: ${{ steps.prep.outputs.config }}
          PATHS: ${{ steps.prep.outputs.paths }}
        run: |
          set -euo pipefail
          zizmor --persona pedantic --format json $CONFIG $PATHS > "${RUNNER_TEMP}/zizmor.json" || true
          python3 - "${RUNNER_TEMP}/zizmor.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          unpinned = [f for f in data if f.get("ident") == "unpinned-uses"]
          if not unpinned:
              print("zizmor: all third-party actions are SHA-pinned.")
              sys.exit(0)
          lines = set()
          for f in unpinned:
              for loc in f.get("locations", []):
                  feat = (loc.get("concrete") or {}).get("feature", "").strip()
                  if feat:
                      lines.add(feat)
          print("::error::zizmor: the following action reference(s) are not SHA-pinned:")
          for l in sorted(lines):
              print(f"  - {l}")
          print("Pin each to a full commit SHA (run `pinact run` locally to auto-fix). "
                "File:line locations are in the full-audit step above.")
          sys.exit(1)
          PY

      # Secondary, config-aware check. Honors a RUNTIME-SYNTHESIZED config (built
      # from the caller's owner) rather than any committed .pinact.yaml, so the
      # gate is deterministic across every repo: first-party + local composites
      # are ignored, and anthropics/claude-code-action is exempt from the
      # semver-comment nit only (it stays SHA-pinned — zizmor still enforces that).
      - name: pinact — verify pins (runtime-synthesized config)
        if: steps.prep.outputs.paths != ''
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSL -o pinact.tar.gz \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_SHA256}  pinact.tar.gz" | sha256sum -c -
          tar -xzf pinact.tar.gz pinact
          install -m 0755 pinact /usr/local/bin/pinact
          pinact --version

          cat > /tmp/pinact.yaml <<EOF
          version: 3
          ignore_actions:
            # First-party org actions/reusables are consumed at a moving ref by design.
            - name: ${OWNER}/.*
              ref: .*
            # Local composite actions have no upstream ref to pin.
            - name: \\./.*
              ref: .*
            # Deliberately SHA-pinned to a main-branch commit; exempt from the
            # semver-comment check only (still SHA-pinned). See octo-brain convention.
            - name: anthropics/claude-code-action
              ref: .*
          EOF

          cd "$GITHUB_WORKSPACE"
          pinact run --check -c /tmp/pinact.yaml

      # Third, independent check: pin INTEGRITY. zizmor and pinact both only prove
      # a ref is SHAPED like a commit SHA -- neither resolves it. A well-formed pin
      # to a SHA that does not exist upstream passes both and then fails at run
      # time, on whichever path uses it (typically a release, long after merge).
      # This resolves every third-party pin against the action's own repository.
      #   FAIL: the SHA is not any object in that repo.
      #   WARN: the SHA is an annotated tag OBJECT rather than a commit.
      #   WARN: the `# vX.Y.Z` label disagrees with the tag upstream -- expected
      #         whenever a moving tag like @v2 has advanced past the pinned commit.
      - name: Pin integrity — resolve every third-party SHA upstream
        if: steps.prep.outputs.paths != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          PATHS: ${{ steps.prep.outputs.paths }}
        # $PATHS is intentionally unquoted (a space-separated list); it is routed
        # through env rather than templated into the shell, so expansion only
        # word-splits and never executes.
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/pin_integrity.py" <<'PIN_INTEGRITY_EOF'
          #!/usr/bin/env python3
          """Pin INTEGRITY check: a well-formed 40-char SHA pin is not the same as a real one.

          The pinning gate (zizmor + pinact) only proves a ref is SHAPED like a commit SHA.
          It cannot tell a pin that resolves from one that does not. This resolves every
          third-party pin against the upstream repo and:

            FAIL  the SHA is not any object in the action's repository (a dead pin -- the
                  workflow will fail at run time, and only on whichever path uses it)
            WARN  the SHA is an annotated TAG OBJECT rather than a commit. Whether the
                  runner resolves this is version-dependent, so it is reported, not failed.
            WARN  the `# vX.Y.Z` label does not match the tag upstream (drifted label;
                  legitimate when a moving tag like @v4 has advanced past the pinned commit)

          First-party (same-owner) and local `./` actions are skipped: they are consumed at
          a moving ref by design.
          """

          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          API = "https://api.github.com"
          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          OWNER = os.environ.get("REPO_OWNER", "").lower()

          # owner/repo[/subpath]@<40-hex>  with an optional trailing "# label" comment.
          USES = re.compile(
              r"""^\s*-?\s*uses:\s*["']?
                  (?P<owner>[A-Za-z0-9][\w.-]*)/(?P<repo>[\w.-]+)
                  (?P<path>(?:/[^@\s"']+)?)
                  @(?P<sha>[0-9a-fA-F]{40})["']?
                  (?:\s*\#\s*(?P<label>\S+))?""",
              re.VERBOSE,
          )
          # A version-ish label we can meaningfully resolve to a tag.
          VERSIONISH = re.compile(r"^v?\d+(\.\d+)*$")


          def api(path):
              """GET a JSON API path. Returns (status, parsed_body_or_None).

              NB: an error body is still non-empty JSON, so callers must inspect the
              status and compare the returned value to what they asked for -- truthiness
              of the body proves nothing.
              """
              req = urllib.request.Request(API + path, headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "pin-integrity-check",
                  **({"Authorization": f"Bearer {TOKEN}"} if TOKEN else {}),
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception:
                  return 0, None


          def tag_sha(owner, repo, tag):
              """Resolve a tag to the commit SHA it points at, dereferencing annotated tags."""
              st, body = api(f"/repos/{owner}/{repo}/git/ref/tags/{tag}")
              if st != 200 or not isinstance(body, dict):
                  return None
              obj = body.get("object") or {}
              if obj.get("type") == "tag":  # annotated -- one more hop to the commit
                  st2, body2 = api(f"/repos/{owner}/{repo}/git/tags/{obj.get('sha')}")
                  if st2 != 200 or not isinstance(body2, dict):
                      return None
                  return ((body2.get("object") or {}).get("sha") or "").lower()
              return (obj.get("sha") or "").lower()


          def classify(owner, repo, sha):
              """Classify a pinned SHA: ("commit"|"tag-object"|"dead", detail).

              A pin must name a commit. Some pins instead name the annotated tag OBJECT
              that a version tag points at -- a plausible-looking mistake, since
              `git/ref/tags/vN` returns exactly that SHA for an annotated tag. It is
              reported separately from a truly dead SHA because it is a different defect
              with a different fix, and because whether the runner tolerates it is not
              something this check should assume.
              """
              st, body = api(f"/repos/{owner}/{repo}/commits/{sha}")
              # Compare the RETURNED sha to the one requested. A 200 carrying a different
              # sha, or an error body (which is still non-empty JSON), is not success.
              got = (body or {}).get("sha", "") if isinstance(body, dict) else ""
              if st == 200 and got.lower() == sha:
                  return ("commit", got.lower())

              st2, body2 = api(f"/repos/{owner}/{repo}/git/tags/{sha}")
              if st2 == 200 and isinstance(body2, dict):
                  target = ((body2.get("object") or {}).get("sha") or "").lower()
                  if target:
                      return ("tag-object", target)

              return ("dead", "")


          def collect(paths):
              """Map (owner, repo, sha, label) -> sorted list of "file:line" sites."""
              seen = {}
              for root in paths:
                  for dirpath, _, files in os.walk(root):
                      for fn in files:
                          if not fn.endswith((".yml", ".yaml")):
                              continue
                          fp = os.path.join(dirpath, fn)
                          try:
                              lines = open(fp, encoding="utf-8", errors="replace").read().splitlines()
                          except OSError:
                              continue
                          for i, line in enumerate(lines, 1):
                              m = USES.match(line)
                              if not m:
                                  continue
                              if m.group("owner").lower() == OWNER:
                                  continue  # first-party: moving ref by design
                              key = (m.group("owner"), m.group("repo"),
                                     m.group("sha").lower(), m.group("label") or "")
                              seen.setdefault(key, []).append(f"{fp}:{i}")
              return seen


          def main():
              paths = [p for p in sys.argv[1:] if os.path.isdir(p)]
              if not paths:
                  print("No workflow/action directories to check -- integrity check is a no-op.")
                  return 0

              pins = collect(paths)
              if not pins:
                  print("No third-party SHA pins found.")
                  return 0

              dead, drifted, ok = [], [], 0
              resolved_cache = {}

              for (owner, repo, sha, label), sites in sorted(pins.items()):
                  ck = (owner, repo, sha)
                  if ck not in resolved_cache:
                      resolved_cache[ck] = classify(owner, repo, sha)
                  kind, detail = resolved_cache[ck]
                  if kind == "dead":
                      dead.append((owner, repo, sha, label, sites))
                      continue
                  ok += 1
                  if kind == "tag-object":
                      # Already the more specific finding; the label check below would only
                      # restate it, since the tag is exactly what this SHA is.
                      drifted.append((owner, repo, sha, label, sites,
                                      "it is an annotated TAG OBJECT, not a commit; "
                                      f"re-pin to {detail[:12]}"))
                  elif label and VERSIONISH.match(label):
                      real = tag_sha(owner, repo, label)
                      if real is None:
                          drifted.append((owner, repo, sha, label, sites, "tag does not exist upstream"))
                      elif real != sha:
                          drifted.append((owner, repo, sha, label, sites,
                                          f"tag {label} points at {real[:12]}"))

              for owner, repo, sha, label, sites, why in drifted:
                  print(f"::warning::{owner}/{repo}@{sha[:12]} is labelled '# {label}' but {why}. "
                        f"({', '.join(sites)})")

              for owner, repo, sha, label, sites in dead:
                  print(f"::error::{owner}/{repo}@{sha} DOES NOT EXIST in that repository"
                        + (f" (labelled '# {label}')" if label else "")
                        + f". Referenced at: {', '.join(sites)}")

              print(f"\npin integrity: {ok} pin(s) resolved, {len(drifted)} label warning(s), "
                    f"{len(dead)} dead pin(s).")

              if dead:
                  print("\nA dead pin is invisible to the pinning gate -- the ref is correctly "
                        "SHA-shaped, it just isn't a real commit. The job using it fails only "
                        "when that path runs, which is typically a release. Re-pin to a SHA that "
                        "exists upstream (`pinact run` will fetch the correct one for the tag).")
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PIN_INTEGRITY_EOF
          python3 "${RUNNER_TEMP}/pin_integrity.py" $PATHS

      # Fourth check: workflow_run CHAIN integrity. The deploy -> triage -> smoke
      # chains in this estate are wired by exact `name:` strings. A `workflow_run`
      # trigger naming a workflow that does not exist is not an error to GitHub --
      # it simply never fires. So a rename silently severs the chain while every
      # run stays green, which is the worst failure shape a safety net can have.
      # Cheap, offline, and repo-local: no API calls, just the checked-out tree.
      - name: Workflow-chain integrity — every workflow_run names a real workflow
        if: steps.prep.outputs.paths != ''
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/wfrun_check.py" <<'WFRUN_CHECK_EOF'
          #!/usr/bin/env python3
          """Assert every `workflow_run` listener names a workflow that actually exists.

          The deploy -> triage -> smoke -> withheld chain is wired by exact `name:` strings.
          A `workflow_run` trigger naming a workflow that does not exist is not an error to
          GitHub -- it simply never fires. So a rename silently severs the chain and every
          run stays green, which is the worst possible failure shape for a safety net.

          Usage: wfrun_check.py <dir-containing-.github/workflows> [...]
          Exit 1 if any listener names a workflow not present in the same repo.
          """

          import os
          import sys

          import yaml


          def workflow_files(root):
              d = os.path.join(root, ".github", "workflows")
              if not os.path.isdir(d):
                  return []
              return [
                  os.path.join(d, f)
                  for f in sorted(os.listdir(d))
                  if f.endswith((".yml", ".yaml"))
              ]


          def load(path):
              try:
                  with open(path, encoding="utf-8") as fh:
                      return yaml.safe_load(fh)
              except Exception:
                  return None


          def triggers(doc):
              """`on:` is parsed by YAML as the boolean True, not the string 'on'."""
              if not isinstance(doc, dict):
                  return {}
              on = doc.get("on", doc.get(True))
              if isinstance(on, str):
                  return {on: None}
              if isinstance(on, list):
                  return {k: None for k in on}
              return on if isinstance(on, dict) else {}


          def check(root):
              files = workflow_files(root)
              if not files:
                  return [], 0

              # Map every declared workflow name -> file. A workflow with no `name:` is
              # displayed by path, which cannot be targeted by workflow_run at all.
              names = {}
              for p in files:
                  doc = load(p)
                  if isinstance(doc, dict) and isinstance(doc.get("name"), str):
                      names[doc["name"]] = os.path.basename(p)

              problems = []
              listeners = 0
              for p in files:
                  doc = load(p)
                  wr = triggers(doc).get("workflow_run")
                  if not isinstance(wr, dict):
                      continue
                  wanted = wr.get("workflows") or []
                  if isinstance(wanted, str):
                      wanted = [wanted]
                  for w in wanted:
                      listeners += 1
                      if w not in names:
                          problems.append((os.path.basename(p), w))
              return problems, listeners


          def main():
              roots = [r for r in sys.argv[1:] if os.path.isdir(r)]
              if not roots:
                  print("No repo directories given.")
                  return 0

              bad = 0
              total = 0
              for root in roots:
                  problems, listeners = check(root)
                  total += listeners
                  for src, want in problems:
                      bad += 1
                      print(
                          f"::error::{os.path.basename(root)}: {src} listens for a workflow "
                          f"named {want!r}, which does not exist in this repo. A workflow_run "
                          f"trigger naming a missing workflow never fires -- the chain is "
                          f"silently severed and every run stays green."
                      )

              print(f"\nworkflow_run integrity: {total} listener(s) checked, {bad} dangling.")
              return 1 if bad else 0


          if __name__ == "__main__":
              sys.exit(main())
          WFRUN_CHECK_EOF
          python3 "${RUNNER_TEMP}/wfrun_check.py" .
