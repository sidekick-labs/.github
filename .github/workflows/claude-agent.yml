name: Claude Code Agent

on:
  workflow_call:

env:
  # Single source of truth for the Claude model across this repo's Claude
  # workflows. Override org-wide via the CLAUDE_MODEL Actions variable; the
  # literal is a safe fallback so an unset var can't yield an empty --model.
  CLAUDE_MODEL: "${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}"

jobs:
  claude:
    name: Claude Code Agent
    # Routed to the caller's jdb pool with a hosted fallback. `vars` resolves in the
    # CALLER (product repos set RUNNER_LABEL, brains RUNNER_LABEL_BEAT); unset means
    # ubuntu-latest. CI-021 was relaxed on 2026-09-28 for jdb only: every jdb job is
    # a single-use `podman run --rm` JIT container, so the App token minted here
    # dies with the job's container. CI-021 still bars persistent self-hosted runners.
    runs-on: ${{ vars.RUNNER_LABEL || vars.RUNNER_LABEL_BEAT || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      # Mint a read-only sidekick-labs-bot token that can read the PRIVATE
      # claude-plugins repo, used ONLY to authenticate the marketplace clone below.
      # Callers pass `secrets: inherit` and the app private key is now scoped to these
      # code repos, so the mint works here. Scoped to just claude-plugins, contents:read.
      # Optional: a caller that is NOT on the key's repo list (e.g. a public repo, kept off
      # it by sidekick-labs/sre-brain#642) gets no token. The agent then runs without the org plugins
      # instead of failing outright.
      - name: Mint plugin-marketplace read token
        id: plugin-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SIDEKICK_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.SIDEKICK_RELEASE_BOT_PRIVATE_KEY }}
          owner: sidekick-labs
          repositories: claude-plugins
          permission-contents: read

      # claude-code-action clones the marketplace with an UNAUTHENTICATED `git clone`
      # (it does NOT use github_token for that — verified via octo-brain#174 smoke test).
      # Configure the ambient git credential with the read token so the private clone
      # authenticates via url.insteadOf rewrite. Scoped to this job only.
      - name: Warn when running without org plugins
        if: steps.plugin-token.outcome == 'failure'
        run: echo "::warning::Could not mint the plugin-marketplace token (caller not on SIDEKICK_RELEASE_BOT_PRIVATE_KEY, or the key/App ID is wrong). Running @claude without the sidekick-workflows plugin."

      - name: Configure git auth for private marketplace clone
        if: steps.plugin-token.outputs.token != ''
        run: |
          git config --global url."https://x-access-token:${{ steps.plugin-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236 (bundled CLI 2.1.284, the first to name claude-sonnet-5-5; claude-opus-5-5 needs CLI >=2.1.280; OAuth needs >=v1.0.168 since the 2026-07-07 auth change)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NB: github_token is deliberately NOT overridden — @claude's identity/writes stay
          # on the Claude App via the OAuth token, unchanged. The clone auth is handled by the
          # git-credential step above, not by github_token (the action ignores it for clones).
          additional_permissions: |
            actions: read
          # Pin the model so the interactive agent doesn't silently shift when
          # the action's default changes. Keep in lockstep with claude-code-review.yml.
          claude_args: '--model ${{ env.CLAUDE_MODEL }} --effort high'
          # Org-wide sidekick-workflows plugin for the interactive agent (octo-brain#174,
          # #135 Phase 2). claude-code-action does NOT read /etc/claude-code/managed-settings.json
          # on ubuntu-latest (no MDM context) — that file is the laptop/MDM channel only; CI uses
          # these native inputs. This is the primary CI lane for org skills (/ship, /land, …).
          # Empty when no marketplace token could be minted (see the mint step).
          plugin_marketplaces: ${{ steps.plugin-token.outputs.token != '' && 'https://github.com/sidekick-labs/claude-plugins.git' || '' }}
          plugins: ${{ steps.plugin-token.outputs.token != '' && 'sidekick-workflows@sidekick-ops' || '' }}
