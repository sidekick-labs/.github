name: CodeQL (Actions)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Run on every PR. A `paths:` filter would skip the workflow on PRs
    # that don't touch `.github/workflows/**`, but this check is required
    # by branch protection — a skipped run leaves the required check in
    # "Expected — Waiting for status to be reported" forever, which
    # blocks every governance-only or doc-only PR. The CodeQL Actions
    # analyzer is fast enough to run unconditionally.
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Actions workflows
    runs-on: ubuntu-latest
    # Runaway-hang cap. Normal run ~0.8 min; 15 leaves generous headroom for a
    # cold CodeQL DB build while replacing the implicit 360-min (6h) default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.36.2 (bundle 2.25.2)
        with:
          languages: actions
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.36.2 (bundle 2.25.2)
        with:
          category: "/language:actions"
