name: Claude Code Review

# THIN SHIM — KEEP IT THAT WAY. The review orchestration lives in
# `.github/actions/claude-review`; this file only decides that the job runs and
# hands it three values the composite cannot resolve for itself.
#
# WHY THE LOGIC IS NOT IN THIS FILE. `anthropics/claude-code-action` exchanges its
# OIDC token with Anthropic, and that endpoint validates SERVER-SIDE that the
# workflow file the job runs from exists on the DEFAULT BRANCH with IDENTICAL
# CONTENT. A PR that edits this file fails that check by construction: the action
# logs "Skipping action due to workflow validation" and RETURNS, leaving the step
# green having done nothing. That is how `.github#127` merged with a green tick
# over a review that never ran. Now that the check emits a fail-closed verdict the
# same condition turns it RED — so with the logic in here, every future edit to the
# review would have been unmergeable. Full evidence: the header of the composite.
#
# THEREFORE: changes to review logic, prompts, skip classes or the verdict contract
# go in `.github/actions/claude-review/action.yml`, which is NOT validated and
# reviews normally. Editing THIS file still trips the guard and still needs a human
# review plus an admin merge — so edit it rarely and deliberately.
#
# ---------------------------------------------------------------------------
# THE CALLER CONTRACT — read before editing a thin caller in another repo.
#
# This context can be a REQUIRED status check, so a caller must guarantee it
# ALWAYS REPORTS, EXACTLY ONCE, for every PR that could be required to have it. A
# context that never reports is not "missing" — it renders as "Expected — waiting
# for status to be reported" and the PR is unmergeable forever.
#
#   1. NO `paths:` / `paths-ignore:` filter on the caller. A filtered-out PR never
#      triggers the workflow, so no check run is created. Path exclusions live in
#      the composite's reviewability classifier, which skips the WORK while still
#      reporting the CONTEXT.
#   2. `ready_for_review` MUST be in the caller's `types:`. The job below is gated
#      on `draft == false` — deliberately, because a draft cannot merge and a green
#      "skipped: draft" would be a false green waiting to be inherited. That only
#      holds if the ready transition fires an event.
#   3. NO job-level `if:` on the caller's job that can suppress that transition.
#
# EXACTLY ONCE: one caller workflow per repo declares this context; with no path
# filter every PR event of its declared types triggers exactly one run; that run
# holds exactly one job emitting the context; the job's only `if:` is the draft
# gate; every other skip is STEP-gated inside the composite so the job always
# reaches a conclusion rather than `skipped`; and `concurrency: cancel-in-progress`
# on the caller bounds in-flight runs to one per PR, with GitHub evaluating the
# most recent check run of a given name. No second job anywhere emits this name,
# so there is no writer to race and no way for a cheap green to outvote a review.
# ---------------------------------------------------------------------------

on:
  workflow_call:

jobs:
  claude_review:
    name: Claude Code Review
    # The ONLY job-level gate, and the only skip that is not step-gated. A skipped
    # JOB reports its status context as not-satisfied, which would leave a required
    # check forever-pending — so everything else is step-gated inside the composite
    # and this job always completes. Drafts are the deliberate exception: they
    # cannot merge, so pending is harmless, whereas a green "skipped: draft" would
    # be inherited the moment the PR is marked ready. See obligation 2 above.
    if: github.event.pull_request.draft == false
    # Homelab-routable review lane. `review / Claude Code Review` is a REQUIRED
    # context in NO sidekick-labs repo except THIS one, and at ~687 min/week it is
    # the largest single workload in the estate — which is what makes it worth
    # routing while the `RUNNER_LABEL` un-gating PRs stay parked on a second host.
    #
    # 🔴 SET THIS VARIABLE AT REPO SCOPE ONLY. NEVER AT ORG SCOPE.
    #
    # `vars` in a called reusable resolves in the CALLER's context, and this repo
    # (`sidekick-labs/.github`) calls it from `pr.yml` for its own review check —
    # which its ruleset REQUIRES. `.github` is PUBLIC, and every runner group here
    # sets `allows_public_repositories: false`, so a self-hosted label can never be
    # served here. An org-scoped variable would therefore make `.github`'s required
    # check queue forever with nothing red — the CI-090 failure mode, on the one
    # repo where this check is mandatory. Arm private, group-admitted repos
    # individually; an unset variable is a hosted no-op, which is why `.github`,
    # `sidekick-ui` and `brain-template` stay hosted by simply never being armed.
    #
    # This stays in the SHIM and not in the composite for the same reason
    # `claude_model` does: `vars` is unavailable inside a composite action, and
    # `runs-on` is a job-level key a composite cannot set at all.
    runs-on: ${{ vars.RUNNER_LABEL_REVIEW || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Review, adjudicate, and report the verdict
        uses: sidekick-labs/.github/.github/actions/claude-review@v3  # moving release tag — see #1/v3
        with:
          # Resolved HERE because neither `secrets` nor `vars` is available inside
          # a composite action. The literal is a safe fallback so an unset org var
          # cannot yield an empty --model.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_model: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          github_token: ${{ github.token }}
