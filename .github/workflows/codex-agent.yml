name: Codex Agent

# The @codex mention responder (replaces claude-agent.yml). The per-repo
# wrapper (codex.yml) gates on an `@codex` mention across issue comments, PR
# review comments, PR reviews, and new/assigned issues, then calls this.
#
# Unlike claude-code-action (which parsed the mention, edited, committed, and
# commented internally) Codex only runs `codex exec`, so this workflow does the
# orchestration: resolve the trigger context, run Codex (workspace-write so it
# CAN edit when asked), always post the final message as a reply comment, and —
# when the request produced changes and release-bot credentials are present —
# push a signed commit (PR head branch) or open a PR (issue), reusing the
# signed-commit-via-API pattern from sre-brain's sentry-autofix-engine.yml.

on:
  workflow_call:
    inputs:
      release-bot-client-id:
        description: "GitHub App client id for the release bot. When set (with the private-key secret) the agent can push commits / open PRs; otherwise it degrades to comment-only."
        type: string
        required: false
        default: ""
      model:
        description: "Optional Codex model override."
        type: string
        required: false
        default: ""
    secrets:
      CODEX_AUTH_JSON:
        description: "Codex subscription auth.json (org secret). Supplied via secrets: inherit."
        required: true
      release-bot-private-key:
        description: "Release-bot GitHub App private key (pairs with release-bot-client-id)."
        required: false

# Serialize concurrent @codex runs on the same issue/PR so two requests don't
# both check out the head branch, commit, and force-PATCH the ref in a race.
# Do NOT cancel-in-progress — a superseded run may be mid-commit.
concurrency:
  group: codex-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  codex:
    name: Codex Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check for Codex auth
        id: token-check
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "${CODEX_AUTH_JSON:-}" ]; then
            echo "::warning::CODEX_AUTH_JSON secret is not configured; skipping Codex agent."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Read everything from the event payload via jq (NEVER interpolate
      # comment/issue bodies into a shell or YAML expression — that's a script
      # injection vector). The raw instruction text is written to a file that
      # is later concatenated into the prompt file, so it is never evaluated.
      - name: Resolve trigger context
        id: ctx
        if: steps.token-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          E="$GITHUB_EVENT_PATH"
          INSTRUCTION_FILE="$RUNNER_TEMP/instruction.txt"

          case "$EVENT_NAME" in
            issue_comment)
              if jq -e '.issue.pull_request' "$E" >/dev/null; then
                IS_PR=true;  NUM=$(jq -r '.issue.number' "$E")
              else
                IS_PR=false; NUM=$(jq -r '.issue.number' "$E")
              fi
              jq -r '.comment.body' "$E" > "$INSTRUCTION_FILE"
              ;;
            pull_request_review_comment)
              IS_PR=true; NUM=$(jq -r '.pull_request.number' "$E")
              jq -r '.comment.body' "$E" > "$INSTRUCTION_FILE"
              ;;
            pull_request_review)
              IS_PR=true; NUM=$(jq -r '.pull_request.number' "$E")
              jq -r '.review.body // ""' "$E" > "$INSTRUCTION_FILE"
              ;;
            issues)
              IS_PR=false; NUM=$(jq -r '.issue.number' "$E")
              jq -r '(.issue.title // "") + "\n\n" + (.issue.body // "")' "$E" > "$INSTRUCTION_FILE"
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac

          DEFAULT_BRANCH=$(gh api "repos/$REPO" --jq '.default_branch')
          IS_FORK=false
          if [ "$IS_PR" = "true" ]; then
            PR=$(gh api "repos/$REPO/pulls/$NUM")
            HEAD_REF=$(jq -r '.head.ref'        <<<"$PR")
            HEAD_REPO=$(jq -r '.head.repo.full_name' <<<"$PR")
            CHECKOUT_REF="$HEAD_REF"
            [ "$HEAD_REPO" != "$REPO" ] && IS_FORK=true
          else
            HEAD_REF=""
            CHECKOUT_REF="$DEFAULT_BRANCH"
          fi

          {
            echo "is_pr=$IS_PR"
            echo "number=$NUM"
            echo "head_ref=$HEAD_REF"
            echo "checkout_ref=$CHECKOUT_REF"
            echo "default_branch=$DEFAULT_BRANCH"
            echo "is_fork=$IS_FORK"
          } >> "$GITHUB_OUTPUT"

      - name: Determine bot token availability
        if: steps.token-check.outputs.skip != 'true'
        env:
          BOT_CLIENT_ID: ${{ inputs.release-bot-client-id }}
          BOT_PRIVATE_KEY: ${{ secrets.release-bot-private-key }}
        run: |
          set -euo pipefail
          if [ -n "${BOT_CLIENT_ID:-}" ] && [ -n "${BOT_PRIVATE_KEY:-}" ]; then
            echo "BOT_TOKEN_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "BOT_TOKEN_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::warning::release-bot credentials not configured — the agent will answer but cannot push commits / open PRs. Add release-bot-client-id input + release-bot-private-key secret to enable that."
          fi

      - name: Mint GitHub App installation token
        id: app_token
        if: steps.token-check.outputs.skip != 'true' && env.BOT_TOKEN_AVAILABLE == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.release-bot-client-id }}
          private-key: ${{ secrets.release-bot-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve bot token availability post-mint
        if: steps.token-check.outputs.skip != 'true' && env.BOT_TOKEN_AVAILABLE == 'true'
        env:
          MINT_OUTCOME: ${{ steps.app_token.outcome }}
          MINT_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$MINT_OUTCOME" != "success" ] || [ -z "${MINT_TOKEN:-}" ]; then
            echo "::warning::App token mint failed (outcome=$MINT_OUTCOME); falling back to comment-only."
            echo "BOT_TOKEN_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: steps.token-check.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.ctx.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token || github.token }}
          persist-credentials: true

      # @main is intentional during the parallel-trial phase. RELEASE CHECKLIST:
      # repin to the release tag/SHA when a reusable-workflow version is cut, so
      # consumers' @v* pins get a matching, immutable composite.
      # See docs/codex-migration.md.
      - name: Setup Codex auth
        if: steps.token-check.outputs.skip != 'true'
        id: codex-auth
        uses: sidekick-labs/.github/.github/actions/setup-codex-auth@main
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}

      - name: Build prompt
        id: prompt
        if: steps.token-check.outputs.skip != 'true'
        env:
          REPO: ${{ github.repository }}
          IS_PR: ${{ steps.ctx.outputs.is_pr }}
          NUM: ${{ steps.ctx.outputs.number }}
          HEAD_REF: ${{ steps.ctx.outputs.head_ref }}
        run: |
          set -euo pipefail
          PROMPT_FILE="$RUNNER_TEMP/codex-prompt.md"
          if [ "$IS_PR" = "true" ]; then
            WHERE="pull request #$NUM (its head branch \`$HEAD_REF\` is checked out)"
          else
            WHERE="issue #$NUM (the default branch is checked out; any changes you make will be opened as a new PR)"
          fi
          {
            printf 'You are the @codex agent responding to a request on %s, %s.\n\n' "$REPO" "$WHERE"
            printf 'Follow the repository CLAUDE.md conventions. If the request is a question or a review, answer it and make NO file changes. If it asks for code changes, make them directly in the working tree.\n\n'
            printf 'Your final message is posted verbatim as a reply comment, so make it clear and self-contained. Never include secrets or the contents of credential files.\n\n'
            printf -- '--- REQUEST ---\n'
            cat "$RUNNER_TEMP/instruction.txt"
          } > "$PROMPT_FILE"
          echo "prompt_file=$PROMPT_FILE" >> "$GITHUB_OUTPUT"

      - name: Run Codex
        if: steps.token-check.outputs.skip != 'true'
        id: run_codex
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1 # v1.8
        with:
          codex-home: ${{ steps.codex-auth.outputs.codex-home }}
          sandbox: workspace-write
          model: ${{ inputs.model }}
          prompt-file: ${{ steps.prompt.outputs.prompt_file }}
          output-file: ${{ runner.temp }}/codex-out.md

      # Commit changes (if any) before composing the comment, so the comment can
      # link the result. Signed-commit-via-API mirrors sre-brain's sentry-autofix-engine.yml.
      - name: Apply changes (commit / open PR)
        id: apply
        if: steps.token-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IS_PR: ${{ steps.ctx.outputs.is_pr }}
          NUM: ${{ steps.ctx.outputs.number }}
          HEAD_REF: ${{ steps.ctx.outputs.head_ref }}
          DEFAULT_BRANCH: ${{ steps.ctx.outputs.default_branch }}
          IS_FORK: ${{ steps.ctx.outputs.is_fork }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "result=none" >> "$GITHUB_OUTPUT"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No file changes from Codex."; exit 0
          fi

          if [ "$BOT_TOKEN_AVAILABLE" != "true" ]; then
            echo "changed=dirty-no-bot" >> "$GITHUB_OUTPUT"
            echo "::warning::Codex produced changes but release-bot creds are absent; not pushing."
            exit 0
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "changed=dirty-fork" >> "$GITHUB_OUTPUT"
            echo "::warning::PR is from a fork; cannot push to the fork branch."
            exit 0
          fi

          git config user.name "sidekick-release-bot[bot]"
          git config user.email "sidekick-release-bot[bot]@users.noreply.github.com"

          MSG="codex: apply changes requested in #$NUM"
          if [ "$IS_PR" = "true" ]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="codex/issue-${NUM}-${RUN_ID}"
            git checkout -b "$BRANCH"
          fi

          git add -A
          git commit -m "$MSG"
          # Push the locally-unsigned commit (these branches aren't under the
          # signed-commit ruleset, which targets only main/production), then
          # upgrade the ref to a server-signed commit via the API.
          git push origin "HEAD:$BRANCH"

          TREE=$(git rev-parse "HEAD^{tree}")
          PARENT=$(git rev-parse HEAD^)
          SIGNED=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" \
            --method POST -f message="$MSG" -f tree="$TREE" -f "parents[]=$PARENT" --jq '.sha')
          [ -z "$SIGNED" ] && { echo "ERROR: failed to create signed commit" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" \
            --method PATCH -f sha="$SIGNED" -F force=true
          UPDATED=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --jq '.object.sha')
          [ "$UPDATED" != "$SIGNED" ] && { echo "ERROR: ref did not advance to signed SHA" >&2; exit 1; }

          if [ "$IS_PR" = "true" ]; then
            echo "result=pushed" >> "$GITHUB_OUTPUT"
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            URL=$(gh pr create --title "codex: $MSG" \
              --body "Requested via @codex in #${NUM}. Generated by \`codex-agent.yml\`." \
              --base "$DEFAULT_BRANCH" --head "$BRANCH")
            echo "result=pr" >> "$GITHUB_OUTPUT"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Post reply comment
        if: steps.token-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NUM: ${{ steps.ctx.outputs.number }}
          RESULT: ${{ steps.apply.outputs.result }}
          PR_URL: ${{ steps.apply.outputs.url }}
          PUSHED_REF: ${{ steps.apply.outputs.ref }}
          CHANGED: ${{ steps.apply.outputs.changed }}
        run: |
          set -euo pipefail
          BODY_FILE="$RUNNER_TEMP/comment.md"
          OUT="$RUNNER_TEMP/codex-out.md"
          # GitHub caps comment bodies at 65536 chars; cap the model output well
          # under that to leave room for the footer (gh api 422s silently on
          # over-length, exiting 0 — so guard here).
          if [ -s "$OUT" ]; then
            head -c 60000 "$OUT" > "$BODY_FILE"
            [ "$(wc -c < "$OUT")" -gt 60000 ] && printf '\n\n_…output truncated…_\n' >> "$BODY_FILE"
          else
            printf '(Codex returned no message.)\n' > "$BODY_FILE"
          fi

          {
            printf '\n\n---\n'
            case "$RESULT" in
              pushed) printf "🤖 Pushed a signed commit to \`%s\`.\n" "$PUSHED_REF" ;;
              pr)     printf '🤖 Opened a PR: %s\n' "$PR_URL" ;;
              *)
                case "${CHANGED:-}" in
                  dirty-no-bot) printf '⚠️ I made local changes but release-bot creds are not configured, so I could not push them.\n' ;;
                  dirty-fork)   printf '⚠️ I made local changes but this PR is from a fork, so I could not push to it.\n' ;;
                  *)            printf "_Generated by \`codex-agent.yml\` (no file changes)._\n" ;;
                esac ;;
            esac
          } >> "$BODY_FILE"

          gh api "repos/$GITHUB_REPOSITORY/issues/$NUM/comments" \
            --method POST -F body=@"$BODY_FILE"
