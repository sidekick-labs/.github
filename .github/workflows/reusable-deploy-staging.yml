name: Reusable — Deploy to DO App Platform (staging)

# Reusable (`workflow_call`) staging deploy for the DOCR + do-app-deploy model.
# Builds the caller's image, pushes it to DOCR tagged at `deploy_sha`, patches
# the staging App Platform appspec to that image via the shared do-app-deploy
# composite action, and polls to ACTIVE. Tracks the rollout as a GitHub
# Deployment and comments on the source PR when the deploy fails.
#
# Extracted from sidekick-inference's inline deploy-staging.yml (itself copied
# from sidekick-harness). Repo-specific values are inputs so harness/web can
# adopt it too. Product-agnostic: non-secret build args go via `build_args`,
# and an optional single build-time SECRET is wired generically through
# `build_secret_id` (the BuildKit secret id) + the `BUILD_SECRET_VALUE` secret
# (e.g. a sourcemap-upload token). No tool-specific names baked in here.
#
# The trigger (workflow_run on CI / workflow_dispatch) and the CI-success gate
# live in the CALLER — a reusable workflow can only be entered via
# workflow_call, so the caller resolves `deploy_sha` and passes it in.
#
# CALLER SETUP: a reusable workflow's GITHUB_TOKEN permissions can only be
# NARROWED by this file, never elevated — so the calling job (or workflow) must
# itself grant `deployments: write` and `pull-requests: write` (plus the
# default `contents: read`). Without them the "Create GitHub Deployment" step
# 403s and fails the deploy. Pass `secrets: inherit` (or DIGITALOCEAN_ACCESS_TOKEN
# explicitly).
#
# VERSION PINNING: the composite actions this workflow calls (do-app-deploy,
# gh-deployment-start/-finish, deploy-failure-comment) are pinned to a commit
# SHA on this repo's `main`, bumped deliberately via PR. This is required
# because a nested `uses: …@main` always resolves at main HEAD, regardless of
# the ref a caller pinned THIS reusable to — so a floating `@main` would
# reproduce the workflow wiring but NOT the composite step logic. (`./` can't
# fix this: in a reusable workflow it resolves against the caller's checkout,
# not this repo.) Bump these pins in lockstep when the actions change.

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: "Exact commit SHA to build and deploy (the SHA CI validated)."
        required: true
        type: string
      image_repo:
        description: "DOCR repository name, e.g. sidekick-inference."
        required: true
        type: string
      app_id:
        description: "DigitalOcean App Platform app ID for the staging app (caller's vars.DO_STAGING_APP_ID)."
        required: true
        type: string
      app_url:
        description: "Staging ingress URL, used for the GitHub Deployment environment link."
        required: true
        type: string
      environment:
        description: "GitHub Environment name to attach the deployment to."
        required: false
        type: string
        default: staging
      dockerfile:
        description: "Path to the Dockerfile to build."
        required: false
        type: string
        default: ./Dockerfile
      context:
        description: "Docker build context."
        required: false
        type: string
        default: .
      build_args:
        description: "Docker build args (multiline KEY=VALUE). Do NOT pass secrets here — visible in `docker history`."
        required: false
        type: string
        default: ""
      build_secrets:
        description: |
          BuildKit secrets passed to the build (multiline KEY=VALUE). Mounted
          only during build, never written to image layers or metadata.
          Reference in the Dockerfile with `RUN --mount=type=secret,id=KEY ...`.
        required: false
        type: string
        default: ""
      build_secret_id:
        description: |
          Optional BuildKit secret id to mount during the build (e.g. a
          sourcemap-upload token id). Its VALUE comes from the BUILD_SECRET_VALUE
          secret — secrets can't travel through the with: inputs. Empty → no
          extra secret is mounted. Note: if this id IS set but
          BUILD_SECRET_VALUE is empty, BuildKit mounts an empty-valued secret
          (not skipped) — a Dockerfile that hard-requires the content sees an
          empty mount rather than a missing one. Single-line values only
          (id=value form); use `build_secrets` for multi-line (PEM-style).
        required: false
        type: string
        default: ""
      enable_triage:
        description: |
          When true, persist the DO deployment ID and upload it as a
          `triage-context` artifact (`do-deployment-id.txt`) so a downstream
          post-deploy-triage workflow (workflow_run on this workflow's name)
          can pinpoint the exact deployment. Off by default — callers without a
          triage workflow leave it unset.
        required: false
        type: boolean
        default: false
      registry:
        description: "DOCR registry name."
        required: false
        type: string
        default: sidekick-labs
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        required: true
      BUILD_SECRET_VALUE:
        description: |
          Optional value for the BuildKit secret named by `build_secret_id`
          (e.g. a sourcemap-upload token). Secrets can't travel through the
          with: inputs, so callers map their own secret here, e.g.
          `BUILD_SECRET_VALUE: secrets.SENTRY_SOURCEMAP_TOKEN`. Unset →
          no extra secret is mounted.
        required: false

permissions:
  contents: read
  deployments: write
  # Required for `gh pr comment` in the failure-notification step.
  pull-requests: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Docker build (cold cache) ~20 min + DO deploy via the composite action's
    # poll (≤30 min) + setup/status ~3 min ≈ 53 min worst case.
    timeout-minutes: 60
    environment: ${{ inputs.environment }}

    env:
      # Only the Summary step reads these from job env now; the deployment
      # lifecycle, image, and environment values are passed to the composites
      # as inputs.
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
      APP_URL: ${{ inputs.app_url }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Build the image from the exact SHA CI validated, not whatever is
          # currently at the tip of the default branch.
          ref: ${{ inputs.deploy_sha }}

      - name: Install doctl
        # Use the org-standard action (same SHA-pinned version as the
        # production / promote reusables) instead of a hand-rolled tarball, so
        # doctl provisioning is identical across all three files. It installs +
        # auths doctl; auth persists under $HOME for the DOCR login and the
        # do-app-deploy composite below.
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DOCR
        # 1 hour — covers cold-cache builds which can exceed the 20 min default.
        run: doctl registry login --expiry-seconds 3600

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push app image
        id: build_push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          build-args: ${{ inputs.build_args }}
          # Caller-supplied non-secret build secrets, plus an optional named
          # build secret wired from the reusable's `secrets:` block (secrets
          # can't flow through the with: inputs). The ternary omits the line
          # entirely when no build_secret_id is set, so other callers are
          # unaffected. Blank lines are harmless — BuildKit skips them.
          secrets: |
            ${{ inputs.build_secrets }}
            ${{ inputs.build_secret_id != '' && format('{0}={1}', inputs.build_secret_id, secrets.BUILD_SECRET_VALUE) || '' }}
          tags: |
            registry.digitalocean.com/${{ inputs.registry }}/${{ inputs.image_repo }}:${{ inputs.deploy_sha }}
          cache-from: type=registry,ref=registry.digitalocean.com/${{ inputs.registry }}/${{ inputs.image_repo }}:cache
          cache-to: type=registry,ref=registry.digitalocean.com/${{ inputs.registry }}/${{ inputs.image_repo }}:cache,mode=max

      - name: Create GitHub Deployment + mark in_progress
        id: deployment
        uses: sidekick-labs/.github/.github/actions/gh-deployment-start@848067fcc24fb22ba28fd2dfdac493b515f7ca3b # 9701a0e — pinned, bump via PR
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ inputs.environment }}
          sha: ${{ inputs.deploy_sha }}
          production_environment: "false"
          description: Staging deploy for ${{ inputs.deploy_sha }}

      - name: Patch appspec & deploy to DigitalOcean
        id: do_deploy
        # Shared composite action: fetch live appspec, patch every component to
        # the DOCR image at this SHA, doctl apps update, poll to a terminal
        # phase. Always exits 0 and reports via outputs — the gate step below is
        # what fails the job, keeping do_deploy_id available to the always()
        # status steps. Referenced by explicit repo path (not `./`) so it
        # resolves from THIS repo regardless of the caller's checkout.
        uses: sidekick-labs/.github/.github/actions/do-app-deploy@848067fcc24fb22ba28fd2dfdac493b515f7ca3b # 9701a0e — pinned, bump via PR
        with:
          app_id: ${{ inputs.app_id }}
          image_repo: ${{ inputs.image_repo }}
          deploy_sha: ${{ inputs.deploy_sha }}

      - name: Fail the job if the deploy did not succeed
        # Gate on `outcome` rather than `phase` so we don't depend on the exact
        # success-phase string (the action sets outcome=success only on ACTIVE).
        if: steps.do_deploy.outputs.outcome != 'success'
        run: |
          echo "::error::Staging deploy did not succeed (phase '${{ steps.do_deploy.outputs.phase }}', expected ACTIVE)"
          exit 1

      - name: Persist DO deployment ID for post-deploy triage
        # Hand the exact DO deployment ID to a downstream post-deploy-triage
        # workflow_run via an artifact. Without this, on failure the triage
        # workflow has to guess which DO deployment is ours — DO auto-rolls back
        # failed deploys by promoting a new ACTIVE deployment, hiding our ERROR'd
        # one behind the rollback in `list-deployments`. Always runs (even after
        # the gate above exits non-zero) so failure-path triage still gets the ID.
        # Gated on enable_triage so callers without a triage workflow skip it.
        if: ${{ always() && inputs.enable_triage && steps.do_deploy.outputs.do_deploy_id != '' }}
        env:
          DO_DEPLOY_ID: ${{ steps.do_deploy.outputs.do_deploy_id }}
        run: |
          mkdir -p /tmp/triage-context
          printf '%s' "$DO_DEPLOY_ID" > /tmp/triage-context/do-deployment-id.txt

      - name: Upload triage context
        if: ${{ always() && inputs.enable_triage && steps.do_deploy.outputs.do_deploy_id != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: triage-context
          path: /tmp/triage-context/
          # The artifact is only consumed by post-deploy-triage, which fires a
          # few minutes after the deploy completes. 1 day buffers triage re-runs.
          retention-days: 1
          if-no-files-found: warn
          # On re-run of the same workflow run, the upload would otherwise fail
          # with "an artifact with this name already exists" — let the rerun
          # replace it so the latest attempt's deployment ID wins.
          overwrite: true

      - name: Post final deployment status
        if: always() && steps.deployment.outputs.deployment_id != ''
        uses: sidekick-labs/.github/.github/actions/gh-deployment-finish@848067fcc24fb22ba28fd2dfdac493b515f7ca3b # 9701a0e — pinned, bump via PR
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          environment: ${{ inputs.environment }}
          app_url: ${{ inputs.app_url }}
          job_status: ${{ job.status }}
          do_phase: ${{ steps.do_deploy.outputs.phase }}
          do_deploy_id: ${{ steps.do_deploy.outputs.do_deploy_id }}
          do_deploy_url: ${{ steps.do_deploy.outputs.do_deploy_url }}

      - name: Classify failure stage
        id: stage
        if: failure()
        env:
          PHASE: ${{ steps.do_deploy.outputs.phase }}
        run: |
          # Walk the pipeline in order; first failed step names the stage.
          if [ "${{ steps.checkout.outcome }}" = "failure" ]; then
            STAGE="repository checkout"
          elif [ "${{ steps.build_push.outcome }}" = "failure" ]; then
            STAGE="image build or push to DOCR"
          elif [ "${{ steps.deployment.outcome }}" = "failure" ]; then
            STAGE="GitHub deployment API call"
          elif [ "${{ steps.do_deploy.outcome }}" = "failure" ]; then
            # do-app-deploy hard-fails only at the appspec fetch/patch stage;
            # the deploy/poll phase exits 0 and reports via `phase` (next branch).
            STAGE="appspec fetch/patch"
          elif [ -n "$PHASE" ] && [ "$PHASE" != "ACTIVE" ]; then
            STAGE="DigitalOcean deploy (phase: \`${PHASE}\`)"
          else
            STAGE="environment setup (doctl, buildx, registry login, …)"
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Comment on merged PR when deploy fails
        if: failure()
        uses: sidekick-labs/.github/.github/actions/deploy-failure-comment@848067fcc24fb22ba28fd2dfdac493b515f7ca3b # 9701a0e — pinned, bump via PR
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ inputs.deploy_sha }}
          title: Staging deploy failed
          stage: ${{ steps.stage.outputs.stage }}
          log_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Summary
        if: always()
        env:
          DO_DEPLOY_ID: ${{ steps.do_deploy.outputs.do_deploy_id }}
          DO_DEPLOY_URL: ${{ steps.do_deploy.outputs.do_deploy_url }}
          DO_PHASE: ${{ steps.do_deploy.outputs.phase }}
        run: |
          {
            echo "## Staging deploy"
            echo ""
            echo "- **SHA:** \`$DEPLOY_SHA\`"
            echo "- **DO deployment:** \`$DO_DEPLOY_ID\`"
            if [ -n "$DO_DEPLOY_URL" ]; then
              echo "- **DO deploy URL:** $DO_DEPLOY_URL"
            fi
            echo "- **Final phase:** \`$DO_PHASE\`"
            echo "- **Environment URL:** $APP_URL"
          } >> "$GITHUB_STEP_SUMMARY"
