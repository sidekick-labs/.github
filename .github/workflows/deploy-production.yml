name: Promote to Production

on:
  workflow_call:
    inputs:
      sentry_org:
        required: true
        type: string
      sentry_project:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string
        default: ""
      do_app_id:
        required: false
        type: string
        default: ""
        description: "DigitalOcean App Platform app ID for deploy status tracking"
      app_url:
        required: false
        type: string
        default: ""
        description: "Production URL for GitHub environment link"

# Never cancel an in-progress promotion
concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ inputs.sentry_org }}
      SENTRY_PROJECT: ${{ inputs.sentry_project }}

    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine target SHA
        id: main
        run: |
          REF="${{ inputs.ref }}"
          if [ -n "$REF" ]; then
            if ! git rev-parse --verify "$REF" &>/dev/null; then
              echo "::error::Ref '$REF' is not a valid commit"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$REF" HEAD; then
              echo "::error::Ref '$REF' is not an ancestor of main — can only promote commits on main"
              exit 1
            fi
            SHA=$(git rev-parse "$REF")
            echo "Promoting up to specified ref: $SHA"
          else
            SHA=$(git rev-parse HEAD)
            echo "Promoting main HEAD: $SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify CI passed on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          echo "Checking CI status for $SHA"

          CONCLUSION=""
          for i in 1 2 3; do
            CONCLUSION=$(gh run list \
              --workflow=ci.yml \
              --branch=main \
              --json headSha,conclusion \
              --jq ".[] | select(.headSha == \"$SHA\") | .conclusion" \
              | head -1)
            if [ -n "$CONCLUSION" ]; then
              break
            fi
            echo "CI run not found yet, retrying in 10s... (attempt $i/3)"
            sleep 10
          done

          if [ -z "$CONCLUSION" ]; then
            echo "::error::No CI run found for SHA $SHA"
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI status is '$CONCLUSION' (expected 'success') for SHA $SHA"
            exit 1
          fi

          echo "CI passed for $SHA"

      - name: Check production branch state
        id: check
        run: |
          SHA="${{ steps.main.outputs.sha }}"

          if ! git rev-parse --verify origin/production &>/dev/null; then
            echo "::error::production branch does not exist — create it first"
            exit 1
          fi

          PROD_SHA=$(git rev-parse origin/production)
          echo "prod_sha=$PROD_SHA" >> "$GITHUB_OUTPUT"

          if [ "$SHA" = "$PROD_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::production branch is already at $SHA — nothing to promote"
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/production "$SHA"; then
            echo "::error::production branch has diverged from target — manual resolution required"
            exit 1
          fi

          COMMIT_COUNT=$(git rev-list origin/production.."$SHA" --count)
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Promoting $COMMIT_COUNT commit(s) to production"

      - name: Generate release tag
        if: steps.check.outputs.skip != 'true'
        id: tag
        run: |
          TODAY=$(date -u +%Y.%m.%d)
          PREFIX="v${TODAY}"

          EXISTING=$(git tag -l "${PREFIX}.*" | sort -t. -k4 -n | tail -1)
          if [ -n "$EXISTING" ]; then
            LAST_N=$(echo "$EXISTING" | rev | cut -d. -f1 | rev)
            NEXT_N=$((LAST_N + 1))
          else
            NEXT_N=1
          fi

          TAG="${PREFIX}.${NEXT_N}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

      - name: Write deploy summary
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          TAG="${{ steps.tag.outputs.tag }}"
          DRY_RUN="${{ inputs.dry_run }}"

          {
            echo "## Production Promotion"
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "> **DRY RUN** — no changes will be promoted"
              echo ""
            fi
            echo "**Tag:** \`$TAG\`"
            echo "**SHA:** \`$SHA\`"
            echo "**Commits:** ${{ steps.check.outputs.commit_count }}"
            echo ""
            echo "### Commits"
            echo ""
            git log origin/production.."$SHA" --format="- %h %s" --reverse
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub deployment
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          DEPLOY_ID=$(gh api repos/${{ github.repository }}/deployments \
            -f ref="$SHA" \
            -f environment="production" \
            -f description="Production release ${{ steps.tag.outputs.tag }}" \
            -f auto_merge=false \
            --jq '.id')
          echo "deployment_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Created GitHub deployment $DEPLOY_ID"

      - name: Promote main to production branch
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          git push origin "${SHA}:refs/heads/production"

          git fetch origin production
          PUSHED_SHA=$(git rev-parse origin/production)
          if [ "$PUSHED_SHA" != "$SHA" ]; then
            echo "::error::Production branch promotion failed — expected $SHA, got $PUSHED_SHA"
            exit 1
          fi

          echo "Promoted production branch to $SHA"

      - name: Wait for DigitalOcean deployment
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true && inputs.do_app_id != ''
        id: do_deploy
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          APP_ID="${{ inputs.do_app_id }}"

          # Install doctl
          wget -qO- https://github.com/digitalocean/doctl/releases/download/v1.115.0/doctl-1.115.0-linux-amd64.tar.gz | tar xz
          sudo mv doctl /usr/local/bin/
          doctl auth init --access-token "$DIGITALOCEAN_ACCESS_TOKEN"

          # Wait for DO to detect the branch push
          echo "Waiting for DigitalOcean to start deployment..."
          sleep 30

          # Get the latest deployment
          DEPLOY_ID=$(doctl apps list-deployments "$APP_ID" --format ID --no-header | head -1)
          if [ -z "$DEPLOY_ID" ]; then
            # Don't `exit 0` here — that would mark this step success and
            # trigger the downstream "Update deployment status (success)"
            # step (which only checks deployment_id, not poll outcome),
            # producing a misleading ✅ badge on the commit.
            echo "deploy_status=missing" >> "$GITHUB_OUTPUT"
            echo "::error::No deployment found for app $APP_ID after the 30s settle window. The branch promotion succeeded but DigitalOcean did not pick up the change — investigate the App Platform integration."
            exit 1
          fi

          echo "Watching deployment $DEPLOY_ID..."

          TIMEOUT=600
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            PHASE=$(doctl apps get-deployment "$APP_ID" "$DEPLOY_ID" --format Phase --no-header)
            echo "  Status: $PHASE (${ELAPSED}s elapsed)"

            case "$PHASE" in
              ACTIVE)
                echo "deploy_status=success" >> "$GITHUB_OUTPUT"
                echo "DigitalOcean deployment succeeded"
                exit 0
                ;;
              ERROR|FAILED|CANCELED)
                echo "deploy_status=failure" >> "$GITHUB_OUTPUT"
                echo "::error::DigitalOcean deployment $PHASE"
                exit 1
                ;;
            esac

            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

          echo "deploy_status=timeout" >> "$GITHUB_OUTPUT"
          echo "::error::DigitalOcean deployment timed out after ${TIMEOUT}s"
          exit 1

      - name: Update deployment status (success)
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true && steps.deployment.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_URL="${{ inputs.app_url }}"
          EXTRA_ARGS=""
          if [ -n "$APP_URL" ]; then
            EXTRA_ARGS="-f environment_url=$APP_URL"
          fi
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deployment_id }}/statuses \
            -f state="success" \
            -f environment="production" \
            -f description="Deployed ${{ steps.tag.outputs.tag }}" \
            $EXTRA_ARGS

      - name: Update deployment status (failure)
        if: failure() && steps.deployment.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deployment_id }}/statuses \
            -f state="failure" \
            -f environment="production" \
            -f description="Deployment failed"

      - name: Create release tag
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          TAG="${{ steps.tag.outputs.tag }}"

          git tag -a "$TAG" "$SHA" -m "Production release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_SHA="${{ steps.check.outputs.prod_sha }}"

          COMMIT_COUNT=$(git rev-list ${PREV_SHA}..${SHA} --count)
          NOTES=$(git log ${PREV_SHA}..${SHA} --format="- %h %s (%an)" --reverse | head -50)

          if [ "$COMMIT_COUNT" -gt 50 ]; then
            NOTES="$NOTES"$'\n'"_($((COMMIT_COUNT - 50)) more commits not shown)_"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --target "$SHA"

          echo "Created GitHub Release $TAG"

      - name: Notify Sentry of production deploy
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          SHA="${{ steps.main.outputs.sha }}"

          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN not configured — skipping Sentry deploy notification"
            exit 0
          fi

          npm install -g @sentry/cli

          sentry-cli releases new "$SHA" 2>/dev/null || true

          # Associate commits with the release. WITHOUT this the release is
          # created empty (commitCount=0), and Sentry's resolve-via-commit —
          # which scans commits ATTACHED TO A RELEASE — never sees the
          # `Fixes <SHORT-CODE>` trailer. The trailer is the documented primary
          # guard against re-filing trackers for already-fixed issues, and it
          # had silently never worked for any repo deploying through here:
          # sidekick-harness/-inference/-companion-kit all showed commitCount=0
          # on every release, while sidekick-web (the one repo that also calls
          # the sentry-release.yml reusable, which does set-commits) showed 1.
          # Diagnosed in sre-brain#278; the re-file loop it enables is #277.
          #
          # Requires the full history the checkout above already fetches
          # (fetch-depth: 0). --ignore-missing tolerates a commit Sentry can't
          # resolve (e.g. the first release, or history rewritten since).
          # Best-effort: a failure here must never fail a deploy that succeeded.
          if sentry-cli releases set-commits "$SHA" --auto --ignore-missing; then
            echo "Associated commits with Sentry release $SHA"
          else
            echo "::warning::Could not associate commits with Sentry release $SHA — Fixes trailers in this range will NOT auto-resolve (see sre-brain#278)"
          fi

          if sentry-cli releases deploys "$SHA" new \
            -e production \
            --name "${{ steps.tag.outputs.tag }}"; then
            echo "Recorded Sentry deploy for release $SHA in production environment"
          else
            echo "::warning::Failed to notify Sentry of deploy — deployment itself succeeded"
          fi

      - name: Final summary
        if: always()
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          TAG="${{ steps.tag.outputs.tag }}"
          SKIP="${{ steps.check.outputs.skip }}"
          DRY_RUN="${{ inputs.dry_run }}"

          if [ "$SKIP" = "true" ]; then
            echo "::notice::No-op — production is already at main ($SHA)"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run complete — would have promoted $TAG ($SHA)"
          else
            echo "::notice::Promoted $TAG ($SHA) to production"
          fi
