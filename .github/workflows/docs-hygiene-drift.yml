name: Docs Drift Report

# Reusable, REPORT-ONLY weekly companion to docs-hygiene.yml (docs-shape rule 5):
# lists every living doc whose `covers:` paths gained commits after its
# `verified:` date. It never fails on findings: a drifted doc is a prompt to
# re-read the code, not a broken build. It DOES fail when it cannot tell
# (shallow clone, not a git work tree) or when its self-test can no longer go
# red, because a silent drift report is indistinguishable from "no drift".
#
# Counting rule: commits touching the covers globs whose date, in the
# committer's own time zone (`%cs`), is strictly AFTER the verified day; a
# same-local-day commit is assumed to be what the verifier read. Archived/superseded docs and `type: report` docs are
# skipped (point-in-time by definition).
#
# Output: annotations plus a table in the run's step summary and, when the
# caller passes `brain-repo`, ONE issue per repo in that brain (rule 5): titled
# `[docs-drift] <repo>: N docs changed since verified`, labelled `docs-drift`,
# refreshed in place each run, closed with a comment once drift is zero
# (drift-issue.mjs in the action). The brain write uses the sidekick-labs
# release-bot App token (SIDEKICK_RELEASE_BOT_PRIVATE_KEY, so callers pass
# `secrets: inherit`), the same credential the system-tests failure sink uses.
# A repo the key is not shared with (a public repo, per sre-brain#642) gets a
# warning and the step summary only. Filing never fails the run.
#
# Consume from a scheduled workflow:
#
#   on:
#     schedule:
#       - cron: '23 1 * * 1'   # weekly, Monday 01:23 UTC
#     workflow_dispatch:
#   jobs:
#     docs-drift:
#       permissions:
#         contents: read
#       uses: sidekick-labs/.github/.github/workflows/docs-hygiene-drift.yml@main
#       with:
#         brain-repo: sidekick-labs/core-platform-brain
#       secrets: inherit

on:
  workflow_call:
    inputs:
      brain-repo:
        description: OWNER/NAME of the owning brain to file the drift issue in. Empty = step summary only.
        type: string
        required: false
        default: ''
      dry-run:
        description: Print the would-be issue (and whether it would create/refresh/close) instead of writing it.
        type: boolean
        required: false
        default: false
    secrets:
      SIDEKICK_RELEASE_BOT_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  drift:
    name: Docs drift report
    # Homelab-routable via the CALLER's RUNNER_LABEL (repo scope only; see claude-code-review.yml).
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The drift question is about history; a shallow clone makes the
          # script exit 3 (UNKNOWN) rather than report "no drift".
          fetch-depth: 0

      - name: Resolve the brain repo name
        id: brain
        if: inputs.brain-repo != ''
        env:
          BRAIN_REPO: ${{ inputs.brain-repo }}
        run: |
          set -euo pipefail
          case "$BRAIN_REPO" in
            sidekick-labs/?*) echo "name=${BRAIN_REPO#sidekick-labs/}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error title=docs-drift::brain-repo must be sidekick-labs/<name> (got '${BRAIN_REPO}')"; exit 2 ;;
          esac

      # issues:write on the brain only. continue-on-error is load-bearing: a
      # caller the key is not shared with must still get its report, with a
      # warning from drift-issue.mjs, not a red run.
      - name: Mint an issues token for the brain
        id: brain-token
        if: inputs.brain-repo != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SIDEKICK_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.SIDEKICK_RELEASE_BOT_PRIVATE_KEY }}
          owner: sidekick-labs
          repositories: ${{ steps.brain.outputs.name }}
          permission-issues: write

      - name: Docs drift report
        uses: sidekick-labs/.github/.github/actions/docs-hygiene@v3  # moving release tag — see #1/v3
        with:
          mode: drift
          brain-repo: ${{ inputs.brain-repo }}
          issue-token: ${{ steps.brain-token.outputs.token }}
          dry-run: ${{ inputs.dry-run }}
