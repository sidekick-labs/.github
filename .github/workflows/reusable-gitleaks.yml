name: Gitleaks Secret Scan

# Reusable gate that fails when the gitleaks secret scanner finds credentials,
# tokens or other high-entropy strings in commits introduced by a pull request
# or pushed to any branch.
#
# Uses the gitleaks binary directly (not gitleaks-action) to avoid the
# GITLEAKS_LICENSE that the action requires for GitHub Organisations. The binary
# is SHA-pinned and checksum-verified at install time.
#
# BYPASS PROTECTION:
# 1. Config: `.gitleaks.toml` is loaded from the BASE commit (not the
#    checked-out tree). When the base has no config, a minimal stub that
#    extends the built-in default rules is used — so the first PR to add a
#    `.gitleaks.toml` in a repo cannot ship a secret together with an allowlist
#    rule for it. To suppress a confirmed false positive, land a `.gitleaks.toml`
#    allowlist rule to the base branch BEFORE landing the PR with the pattern.
#    Every caller `.gitleaks.toml` MUST include `[extend]\nuseDefault = true`;
#    without it gitleaks runs with zero rules and passes every PR silently. The
#    step fails explicitly if this is missing, so the error is visible.
#    Note: allowlist syntax is `[[allowlists]]` (or per-rule `[[rules.allowlists]]`).
#    Relative `[extend] path` entries resolve against `$RUNNER_TEMP`, where the
#    config file is written — they will not resolve correctly.
# 2. Inline allow-comments: `--ignore-gitleaks-allow` is passed so `# gitleaks:allow`
#    inline comments in the PR's code cannot suppress a finding.
# 3. `.gitleaksignore`: the ignore path is set from the base commit. If the base
#    has no `.gitleaksignore`, an empty file is used so the PR cannot add one.
#    gitleaks 8.30.1 auto-loads `<source>/.gitleaksignore` regardless of
#    `--gitleaks-ignore-path` (verified by local test: a fingerprint placed in
#    `<source>/.gitleaksignore` suppresses findings even when the explicit flag
#    points at an empty file). To prevent a PR from adding its own fingerprints,
#    the scan step removes `.gitleaksignore` from the working tree with `rm -f`
#    before invoking gitleaks. `rm -f` removes a symlink itself without following
#    it, which also closes the symlink-at-destination attack surface that a
#    `cp`-based approach would expose.
#
# RESIDUAL RISKS: these controls cover the workflow behaviour, but the gate is
# only as strong as how callers wire it in:
#   - Make "Secret scan" a REQUIRED STATUS CHECK in each caller repo (branch
#     protection or ruleset). Without it a PR can skip the job entirely.
#   - Protect `.github/workflows/` with CODEOWNERS in each caller (or a ruleset).
#     Without it a PR can delete or modify the caller workflow to drop the job.
#   - Add CODEOWNERS protection on `.gitleaks.toml` and `.gitleaksignore` in
#     each caller if you want to prevent a repo admin from self-reviewing an
#     allowlist change to the base branch.
#   - For non-first `push` events, config is loaded from `github.event.before`
#     (the previous tip of the branch). A determined author could land an
#     allowlist rule in one push, then a matching secret in the next. For first
#     pushes of a branch, config is loaded from the merge-base with the default
#     branch, so a new branch cannot bring its own allowlist. The two-push bypass
#     on non-first pushes is a known residual risk (tracked separately).
#
# USAGE: callers may trigger on `pull_request` and/or `push`. `pull_request_target`
# and `merge_group` are rejected immediately (unsupported event). Force-pushes
# may make `github.event.before` unreachable in the clone; the job fails hard.
#
# Consume from a PR workflow:
#
#   jobs:
#     gitleaks:
#       name: Secret scan
#       permissions:
#         contents: read
#       uses: sidekick-labs/.github/.github/workflows/reusable-gitleaks.yml@v3
#       with:
#         runner-label: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
#
# Job permissions MUST NOT exceed `contents: read`. Callers that grant more
# hit startup_failure on the reusable (fundbright .github#78 post-mortem).

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          Label of the runner to execute on. Defaults to ubuntu-latest, which is
          safe for public callers: the homelab self-hosted runner groups carry
          `allows_public_repositories: false`. Private callers on the fleet pass
          their homelab label, e.g. `jdb`.
        required: false
        type: string
        default: 'ubuntu-latest'

permissions: {}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks v8.30.1
        # Binary is downloaded from GitHub Releases and verified against a
        # pinned SHA-256 before extraction. No sudo or apt required —
        # extraction goes to $RUNNER_TEMP, which is always writable.
        # Both x86_64 and aarch64 Linux runners are covered; any other
        # architecture fails explicitly.
        # Checksums verified against gitleaks_8.30.1_checksums.txt on
        # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_ARM64_SHA256: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
            SHA256="${GITLEAKS_ARM64_SHA256}"
          elif [ "$ARCH" = "x86_64" ]; then
            ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            SHA256="${GITLEAKS_X64_SHA256}"
          else
            echo "::error::Unsupported architecture: $ARCH (expected x86_64 or aarch64)" >&2
            exit 1
          fi
          curl -sSfL --retry 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          echo "${SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Resolve scan range
        # Computes BASE and HEAD for the gitleaks log range.
        # pull_request: the PR base/head SHAs.
        # push:         github.event.before..github.sha. When `before` is all
        #               zeros (first push of a branch) there is no prior tip to
        #               trust, so BASE is the merge-base with the default branch
        #               (every commit introduced by the push is scanned, and the
        #               config still comes from a commit the push did not write).
        #               If that yields nothing usable (the default branch itself,
        #               a root commit) BASE is left empty and the later steps scan
        #               the full history with the stub config.
        # Any other event fails fast.
        id: resolve-range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              if [ -z "$base" ]; then
                echo "::error::PR_BASE is empty — this reusable requires a non-empty pull_request base." >&2
                exit 1
              fi
              if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
                echo "::error::PR base SHA (${base:0:8}) is not present in this checkout." >&2
                exit 1
              fi
              ;;
            push)
              head="$PUSH_SHA"
              if echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
                base=""
                # fetch-depth: 0 already populated refs/remotes/origin/*; no extra fetch needed.
                if [ -n "$DEFAULT_BRANCH" ]; then
                  base="$(git merge-base "origin/$DEFAULT_BRANCH" "$head" 2>/dev/null || true)"
                fi
                if [ -n "$base" ] && ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
                  base=""
                fi
                if [ "$base" = "$head" ]; then
                  base=""
                fi
              else
                base="$PUSH_BEFORE"
                if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
                  echo "::error::github.event.before (${base:0:8}) is not reachable in this checkout; cannot establish a trusted base." >&2
                  exit 1
                fi
              fi
              ;;
            *)
              echo "::error::Unsupported event '${EVENT_NAME}'. This reusable supports pull_request and push." >&2
              exit 1
              ;;
          esac
          if ! git rev-parse --verify --quiet "${head}^{commit}" >/dev/null; then
            echo "::error::HEAD (${head:0:8}) is not present in this checkout." >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then
            echo "Resolved scan range: ${base:0:8}..${head:0:8} ($EVENT_NAME)"
          else
            echo "No trusted base for ${head:0:8} ($EVENT_NAME): scanning full history with the built-in rules"
          fi

      - name: Resolve gitleaks config and ignore-path from base commit
        # Loads .gitleaks.toml and .gitleaksignore from BASE so the diff under
        # review cannot introduce allowlist bypass rules in the same change.
        # When absent on the base, a minimal stub (default rules, no allowlist)
        # and an empty ignore-path file are used respectively. With no trusted
        # base at all (BASE_SHA empty) only the stub is used: `git show :path`
        # would otherwise read the checked-out tree, which the push wrote.
        env:
          BASE_SHA: ${{ steps.resolve-range.outputs.base }}
        run: |
          # Config: load from base or write a stub that extends built-in rules.
          CONFIG_PATH="${RUNNER_TEMP}/.gitleaks.toml"
          if [ -n "${BASE_SHA}" ] && git show "${BASE_SHA}:.gitleaks.toml" > "${CONFIG_PATH}" 2>/dev/null; then
            echo "Using .gitleaks.toml from base commit ${BASE_SHA:0:8}"
            # Guard: a base config without `[extend] useDefault = true` scans with
            # zero rules and passes every PR silently. Fail fast so the problem is
            # visible rather than a quiet false-negative.
            if ! grep -Eq '^\s*useDefault\s*=\s*true' "${CONFIG_PATH}"; then
              echo "::error::base .gitleaks.toml does not set '[extend] useDefault = true'. Without it gitleaks scans with zero built-in rules and will pass every PR. Add '[extend]\\nuseDefault = true' to the base config." >&2
              exit 1
            fi
          else
            printf '[extend]\nuseDefault = true\n' > "${CONFIG_PATH}"
            echo "No .gitleaks.toml at base commit ${BASE_SHA:0:8} — using built-in default rules"
          fi

          # Ignore-path: load from base or use an empty file.
          IGNORE_PATH="${RUNNER_TEMP}/.gitleaksignore"
          if [ -n "${BASE_SHA}" ] && git show "${BASE_SHA}:.gitleaksignore" > "${IGNORE_PATH}" 2>/dev/null; then
            echo "Using .gitleaksignore from base commit ${BASE_SHA:0:8}"
          else
            touch "${IGNORE_PATH}"
            echo "No .gitleaksignore at base commit ${BASE_SHA:0:8} — using empty ignore list"
          fi

          echo "GITLEAKS_CONFIG_PATH=${CONFIG_PATH}" >> "${GITHUB_ENV}"
          echo "GITLEAKS_IGNORE_PATH=${IGNORE_PATH}" >> "${GITHUB_ENV}"

      - name: Scan diff for secrets
        # Scans only the commits in BASE..HEAD so that pre-existing secrets in
        # history do not block unrelated PRs. BASE and HEAD are resolved by the
        # "Resolve scan range" step above; an empty BASE means no trusted base
        # exists (new default branch, root commit) and the full history is scanned.
        #
        # Note: `gitleaks git` takes the repository as a positional argument,
        # not via --source (which is a `detect` flag). Omitting it defaults to
        # the current directory.
        env:
          BASE_SHA: ${{ steps.resolve-range.outputs.base }}
          HEAD_SHA: ${{ steps.resolve-range.outputs.head }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
            echo "Scanning ${BASE_SHA:0:8}..${HEAD_SHA:0:8}"
          else
            LOG_OPTS="${HEAD_SHA}"
            echo "Scanning the full history reachable from ${HEAD_SHA:0:8}"
          fi
          # Remove .gitleaksignore from the working tree before scanning.
          # gitleaks auto-loads <source>/.gitleaksignore regardless of
          # --gitleaks-ignore-path. `rm -f` removes a symlink without
          # following it so a PR-committed symlink cannot redirect the removal.
          rm -f .gitleaksignore
          gitleaks git \
            --log-opts "${LOG_OPTS}" \
            --config "${GITLEAKS_CONFIG_PATH}" \
            --gitleaks-ignore-path "${GITLEAKS_IGNORE_PATH}" \
            --ignore-gitleaks-allow \
            --redact \
            --verbose
