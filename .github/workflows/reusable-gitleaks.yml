name: Gitleaks Secret Scan

# Reusable PR gate that fails when the gitleaks secret scanner finds credentials,
# tokens or other high-entropy strings committed to the PR diff.
#
# Uses the gitleaks binary directly (not gitleaks-action) to avoid the
# GITLEAKS_LICENSE that the action requires for GitHub Organisations. The binary
# is SHA-pinned and checksum-verified at install time.
#
# BYPASS PROTECTION:
# 1. Config: `.gitleaks.toml` is loaded from the PR's BASE commit (not the
#    checked-out PR tree). When the base has no config, a minimal stub that
#    extends the built-in default rules is used — so the first PR to add a
#    `.gitleaks.toml` in a repo cannot ship a secret together with an allowlist
#    rule for it. To suppress a confirmed false positive, land a `.gitleaks.toml`
#    allowlist rule to the base branch BEFORE landing the PR with the pattern.
# 2. Inline allow-comments: `--ignore-gitleaks-allow` is passed so `# gitleaks:allow`
#    inline comments in the PR's code cannot suppress a finding.
# 3. `.gitleaksignore`: the ignore path is set from the base commit. If the base
#    has no `.gitleaksignore`, an empty file is used so the PR cannot add one.
#
# These controls require CODEOWNERS protection on `.gitleaks.toml` in callers if
# you want to prevent a repo admin from self-reviewing an allowlist change.
#
# Consume from a PR workflow:
#
#   jobs:
#     gitleaks:
#       name: Secret scan
#       permissions:
#         contents: read
#       uses: sidekick-labs/.github/.github/workflows/reusable-gitleaks.yml@v3
#       with:
#         runner-label: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
#
# Job permissions MUST NOT exceed `contents: read`. Callers that grant more
# hit startup_failure on the reusable (fundbright .github#78 post-mortem).

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          Label of the runner to execute on. Defaults to ubuntu-latest, which is
          safe for public callers: the homelab self-hosted runner groups carry
          `allows_public_repositories: false`. Private callers on the fleet pass
          their homelab label, e.g. `jdb`.
        required: false
        type: string
        default: 'ubuntu-latest'

permissions: {}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks v8.30.1
        # Binary is downloaded from GitHub Releases and verified against a
        # pinned SHA-256 before extraction. No sudo or apt required —
        # extraction goes to $RUNNER_TEMP, which is always writable.
        # Both x86_64 and aarch64 Linux runners are covered; any other
        # architecture fails explicitly.
        # Checksums verified against gitleaks_8.30.1_checksums.txt on
        # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_ARM64_SHA256: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
            SHA256="${GITLEAKS_ARM64_SHA256}"
          elif [ "$ARCH" = "x86_64" ]; then
            ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            SHA256="${GITLEAKS_X64_SHA256}"
          else
            echo "::error::Unsupported architecture: $ARCH (expected x86_64 or aarch64)" >&2
            exit 1
          fi
          curl -sSfL --retry 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          echo "${SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Resolve gitleaks config and ignore-path from base commit
        # Loads .gitleaks.toml and .gitleaksignore from the PR's BASE commit
        # so the PR branch cannot introduce bypass rules in the same diff.
        # When absent on the base, a minimal stub (default rules, no allowlist)
        # and an empty ignore-path file are used respectively.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::BASE_SHA is empty — this reusable requires a pull_request event." >&2
            exit 1
          fi

          # Config: load from base or write a stub that extends built-in rules.
          CONFIG_PATH="${RUNNER_TEMP}/.gitleaks.toml"
          if git show "${BASE_SHA}:.gitleaks.toml" > "${CONFIG_PATH}" 2>/dev/null; then
            echo "Using .gitleaks.toml from base commit ${BASE_SHA:0:8}"
          else
            printf '[extend]\nuseDefault = true\n' > "${CONFIG_PATH}"
            echo "No .gitleaks.toml at base commit ${BASE_SHA:0:8} — using built-in default rules"
          fi

          # Ignore-path: load from base or use an empty file.
          IGNORE_PATH="${RUNNER_TEMP}/.gitleaksignore"
          if git show "${BASE_SHA}:.gitleaksignore" > "${IGNORE_PATH}" 2>/dev/null; then
            echo "Using .gitleaksignore from base commit ${BASE_SHA:0:8}"
          else
            touch "${IGNORE_PATH}"
            echo "No .gitleaksignore at base commit ${BASE_SHA:0:8} — using empty ignore list"
          fi

          echo "GITLEAKS_CONFIG_PATH=${CONFIG_PATH}" >> "${GITHUB_ENV}"
          echo "GITLEAKS_IGNORE_PATH=${IGNORE_PATH}" >> "${GITHUB_ENV}"

      - name: Scan PR diff for secrets
        # Scans only the commits introduced by this PR (BASE..HEAD) so that
        # pre-existing secrets in the repository's history do not block
        # unrelated PRs. This workflow is designed as a pull_request gate;
        # if HEAD_SHA is absent the step fails explicitly.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "${HEAD_SHA}" ]; then
            echo "::error::HEAD_SHA is empty — this reusable requires a pull_request event." >&2
            exit 1
          fi
          echo "Scanning ${BASE_SHA:0:8}..${HEAD_SHA:0:8} (PR diff only)"
          gitleaks git \
            --source . \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --config "${GITLEAKS_CONFIG_PATH}" \
            --gitleaks-ignore-path "${GITLEAKS_IGNORE_PATH}" \
            --ignore-gitleaks-allow \
            --redact \
            --verbose
