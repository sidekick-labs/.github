name: Gitleaks Secret Scan

# Reusable PR gate that fails when the gitleaks secret scanner finds credentials,
# tokens or other high-entropy strings committed to the PR diff.
#
# Uses the gitleaks binary directly (not gitleaks-action) to avoid the
# GITLEAKS_LICENSE that the action requires for GitHub Organisations. The binary
# is SHA-pinned and checksum-verified at install time.
#
# ALLOWLIST NOTE: this workflow loads `.gitleaks.toml` from the PR *base* commit
# (not the checked-out PR tree) so a PR cannot add both a secret and an allowlist
# entry that hides it in the same diff. If no base config exists, the default
# gitleaks rules apply. To suppress a confirmed false positive, add the allowlist
# rule in a *separate* PR to the base branch before landing the PR with the
# pattern. The PR body for that allowlist PR should cite the rule id and the
# reason the pattern is safe.
#
# Consume from a PR workflow:
#
#   jobs:
#     gitleaks:
#       name: Secret scan
#       permissions:
#         contents: read
#       uses: sidekick-labs/.github/.github/workflows/reusable-gitleaks.yml@v3
#       with:
#         runner-label: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
#
# Job permissions MUST NOT exceed `contents: read`. Callers that grant more
# hit startup_failure on the reusable (fundbright .github#78 post-mortem).

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          Label of the runner to execute on. Defaults to ubuntu-latest, which is
          safe for public callers: the homelab self-hosted runner groups carry
          `allows_public_repositories: false`. Private callers on the fleet pass
          their homelab label, e.g. `jdb`.
        required: false
        type: string
        default: 'ubuntu-latest'

permissions: {}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks v8.30.1
        # Binary is downloaded from GitHub Releases and verified against a
        # pinned SHA-256 before extraction. No sudo or apt required —
        # extraction goes to $RUNNER_TEMP, which is always writable.
        # Both x86_64 and aarch64 Linux runners are covered; any other
        # architecture fails explicitly.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_ARM64_SHA256: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
            SHA256="${GITLEAKS_ARM64_SHA256}"
          elif [ "$ARCH" = "x86_64" ]; then
            ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            SHA256="${GITLEAKS_X64_SHA256}"
          else
            echo "Unsupported architecture: $ARCH (expected x86_64 or aarch64)" >&2
            exit 1
          fi
          curl -sSfL --retry 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          echo "${SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Resolve scan range
        # Computes BASE and HEAD for the gitleaks log range.
        # pull_request: the PR base/head SHAs.
        # push:         github.event.before..github.sha. When `before` is all
        #               zeros (first push of a branch) there is no prior tip to
        #               trust, so BASE is the merge-base with the default branch
        #               (every commit introduced by the push is scanned, and the
        #               config still comes from a commit the push did not write).
        #               If that yields nothing usable (the default branch itself,
        #               a root commit) BASE is left empty and the later steps scan
        #               the full history with the stub config.
        # Any other event fails fast.
        id: resolve-range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              ;;
            push)
              head="$PUSH_SHA"
              if echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
                base=""
                if [ -n "$DEFAULT_BRANCH" ] && git fetch --quiet origin "$DEFAULT_BRANCH" 2>/dev/null; then
                  base="$(git merge-base --quiet "origin/$DEFAULT_BRANCH" "$head" 2>/dev/null || true)"
                fi
                if [ -n "$base" ] && ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
                  base=""
                fi
                if [ "$base" = "$head" ]; then
                  base=""
                fi
              else
                base="$PUSH_BEFORE"
                if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
                  echo "::error::github.event.before (${base:0:8}) is not reachable in this checkout; cannot establish a trusted base." >&2
                  exit 1
                fi
              fi
              ;;
            *)
              echo "::error::Unsupported event '${EVENT_NAME}'. This reusable supports pull_request and push." >&2
              exit 1
              ;;
          esac
          if ! git rev-parse --verify --quiet "${head}^{commit}" >/dev/null; then
            echo "::error::HEAD (${head:0:8}) is not present in this checkout." >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then
            echo "Resolved: ${base:0:8}..${head:0:8} ($EVENT_NAME)"
          else
            echo "No trusted base for ${head:0:8} ($EVENT_NAME): scanning full history with the built-in rules"
          fi

      - name: Resolve gitleaks config from base commit
        # Load .gitleaks.toml from BASE so the diff under review cannot introduce
        # an allowlist rule that hides a secret in the same change.
        # Falls back to no config (default gitleaks rules) if the file is absent.
        env:
          BASE_SHA: ${{ steps.resolve-range.outputs.base }}
        run: |
          CONFIG_FLAG=""
          if [ -n "${BASE_SHA}" ]; then
            if git show "${BASE_SHA}:.gitleaks.toml" > "${RUNNER_TEMP}/.gitleaks.toml" 2>/dev/null; then
              echo "Using .gitleaks.toml from base commit ${BASE_SHA:0:8}"
              CONFIG_FLAG="--config ${RUNNER_TEMP}/.gitleaks.toml"
            else
              echo "No .gitleaks.toml at base commit ${BASE_SHA:0:8} — using default rules"
            fi
          fi
          echo "GITLEAKS_CONFIG_FLAG=${CONFIG_FLAG}" >> "${GITHUB_ENV}"

      - name: Scan diff for secrets
        # Scans BASE..HEAD. BASE and HEAD are resolved by "Resolve scan range".
        # An empty BASE means no trusted base exists; the full history is scanned.
        env:
          BASE_SHA: ${{ steps.resolve-range.outputs.base }}
          HEAD_SHA: ${{ steps.resolve-range.outputs.head }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
            echo "Scanning ${BASE_SHA:0:8}..${HEAD_SHA:0:8}"
          else
            LOG_OPTS="${HEAD_SHA}"
            echo "Scanning the full history reachable from ${HEAD_SHA:0:8}"
          fi
          # shellcheck disable=SC2086
          gitleaks git \
            --source . \
            --log-opts "${LOG_OPTS}" \
            --redact \
            --verbose \
            ${GITLEAKS_CONFIG_FLAG}
