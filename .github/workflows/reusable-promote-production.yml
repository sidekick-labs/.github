name: Reusable — Promote to Production

# Reusable (`workflow_call`) promote step for the DOCR + do-app-deploy model.
# Validates the target SHA can safely deploy (on main, CI green, DOCR image
# present), fast-forward pushes it to refs/heads/production, then **explicitly
# dispatches** the caller's production deploy workflow.
#
# Why explicit dispatch instead of "push → CI → workflow_run"? The caller's
# deploy-production workflow only has `workflow_dispatch`, and CI is scoped to
# `[main]` only, so a push to production fires nothing implicitly. The chain is
# explicit by design.
#
# The FF-push is authenticated by a GitHub App installation token
# (`sidekick-release-bot`), NOT GITHUB_TOKEN — github-actions[bot] has no
# stable identity for the production-ruleset bypass list, so we use an App that
# IS on the bypass list. Extracted from sidekick-inference's inline
# promote-production.yml (originally from sidekick-web PR #1023).
#
# CALLER SETUP (passed in as inputs/secrets):
#   - vars.RELEASE_BOT_CLIENT_ID      → input  release_bot_client_id
#   - secrets.RELEASE_BOT_PRIVATE_KEY → secret RELEASE_BOT_PRIVATE_KEY
#   - vars.DO_PRODUCTION_APP_ID       → input  do_production_app_id
#   Plus: the App installed on the caller repo + on the `production` ruleset
#   bypass list, and the caller's production deploy workflow filename.
#
# DISPATCH CONTRACT: the deploy is dispatched with `--field ref=<sha>`, so the
# caller's production deploy workflow (deploy_production_workflow) MUST live on
# the default branch and expose a `workflow_dispatch` input named `ref`, then
# forward it to the production reusable's `deploy_sha`. A mismatch fails the
# dispatch AFTER the FF-push (production advanced, deploy never started).
#
# Also: a reusable workflow's GITHUB_TOKEN permissions can only be NARROWED
# here, never elevated — the calling job/workflow must itself grant
# `pull-requests: write` (failure-comment on the source PR) plus `contents: read`.
# The production deploy is dispatched with the release-bot App token (see the
# Dispatch step), NOT GITHUB_TOKEN, so callers no longer need to grant
# `actions: write` — GITHUB_TOKEN here only needs `actions: read` (watchdog).
#
# VERSION PINNING: the composite actions this workflow calls (docr-image-exists,
# deploy-failure-comment) are pinned to a commit SHA on this repo's `main`,
# bumped deliberately via PR. A nested `uses: …@main` would resolve at main HEAD
# regardless of the ref a caller pinned THIS reusable to. Bump these pins in
# lockstep when the actions change.

on:
  workflow_call:
    inputs:
      image_repo:
        description: "DOCR repository name, e.g. sidekick-inference."
        required: true
        type: string
      do_production_app_id:
        description: "DigitalOcean production app ID (caller's vars.DO_PRODUCTION_APP_ID)."
        required: true
        type: string
      release_bot_client_id:
        description: "sidekick-release-bot GitHub App Client ID (caller's vars.RELEASE_BOT_CLIENT_ID). Public, not a secret."
        required: true
        type: string
      target_ref:
        description: "Commit SHA to promote (must be on main). Empty → caller's github.sha."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Validate everything but don't push to production or dispatch the deploy."
        required: false
        type: boolean
        default: false
      deploy_production_workflow:
        description: "Filename of the caller's production deploy workflow to dispatch."
        required: false
        type: string
        default: deploy-production.yml
      ci_workflow_name:
        description: "Name (the workflow's `name:`, not filename) of the CI run whose success gates promotion."
        required: false
        type: string
        default: CI
      environment:
        description: "GitHub Environment that gates the release decision."
        required: false
        type: string
        default: production
      registry:
        description: "DOCR registry name."
        required: false
        type: string
        default: sidekick-labs
      slack_channel:
        description: |
          Slack channel ID (C…) for the release deploy thread. When set (and not
          a dry-run / no-op re-promote), promote posts the thread root here and
          passes its ts to the deploy via the dispatch. Empty → no Slack posting.
        required: false
        type: string
        default: ""
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        required: true
      SLACK_BOT_TOKEN:
        description: "Slack bot token (xoxb-…) with chat:write — only needed when slack_channel is set."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Used for the AI release-summary step. Underscore name so `secrets: inherit` matches the org secret (a hyphenated name never matched → the summary silently no-op'd). Absent → that step soft-skips and the root falls back to the linked PR list."
        required: false

permissions:
  # The FF-push to `production` does NOT use GITHUB_TOKEN (see the App-token
  # step). contents: read here is just for read-side gh api calls.
  contents: read
  # actions: read for the watchdog's `gh run list` (confirm the deploy started).
  # The deploy DISPATCH no longer uses GITHUB_TOKEN — it uses the release-bot
  # App token so the deploy's completion workflow_run reaches post-deploy-triage
  # (a GITHUB_TOKEN-created run would be suppressed by the no-recursive-runs
  # guard), so GITHUB_TOKEN no longer needs actions: write here.
  actions: read
  # Allows the failure-notification step to comment on the source PR.
  pull-requests: write

jobs:
  promote:
    name: Promote to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Validation + push only — no image build, no DO rollout.
    timeout-minutes: 15
    # `environment` here so any GH Environment protection rules gate the human
    # action of cutting a release — not the downstream DO rollout.
    environment: ${{ inputs.environment }}

    env:
      DO_PRODUCTION_APP_ID: ${{ inputs.do_production_app_id }}
      TARGET_SHA: ${{ inputs.target_ref || github.sha }}
      # Used by the dry-run summary; the DOCR image check now takes image_repo /
      # registry as composite inputs.
      IMAGE_REPO: ${{ inputs.image_repo }}

    steps:
      - name: Mint GitHub App installation token
        # The fast-forward push to `production` is rejected by branch protection
        # unless the actor is on the ruleset's bypass list. The
        # `sidekick-release-bot` GitHub App IS on that list, so we mint a
        # short-lived installation token and use it for checkout + FF-push.
        #
        # Note: v3 of this action uses `client-id` (the App Client ID from
        # General Settings), NOT the numeric App ID.
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.release_bot_client_id }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Scope the token to the minimum it needs:
          #   contents:write → the FF-push to `production`.
          #   actions:write  → dispatch the production deploy below. The deploy
          #     MUST be dispatched by the App (not GITHUB_TOKEN): GitHub's
          #     "no recursive workflow runs" guard suppresses the deploy run's
          #     completion `workflow_run` event when the run was created by
          #     GITHUB_TOKEN, so post-deploy-triage (which listens via
          #     workflow_run) never fires for production. App-token-created runs
          #     are exempt, so the triage verdict reaches the release thread.
          # create-github-app-token narrows the token to ONLY the permission-*
          # scopes requested here, so actions:write must be listed explicitly
          # even though the App is granted it at the installation level.
          permission-contents: write
          permission-actions: write

      - name: Checkout (full history for ancestor check)
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # App token (not GITHUB_TOKEN) so the credential helper this action
          # installs is what `git push` uses below.
          token: ${{ steps.app_token.outputs.token }}

      - name: Resolve target SHA and verify it's on main
        id: target
        run: |
          set -euo pipefail
          # Ensure refs/remotes/origin/main exists regardless of which ref this
          # workflow was dispatched from. actions/checkout only populates the
          # tracking ref for the checked-out branch, so a dispatch from a tag or
          # the production branch would otherwise leave origin/main absent and
          # the ancestor check below would error ("not a valid object name")
          # instead of gating cleanly.
          git fetch --no-tags origin main:refs/remotes/origin/main

          # TARGET_SHA is always non-empty: the env default resolves to
          # github.sha when no ref is supplied. Normalise short → full SHA.
          TARGET=$(git rev-parse "${TARGET_SHA}")

          if ! git merge-base --is-ancestor "$TARGET" origin/main; then
            echo "::error::$TARGET is not an ancestor of origin/main — refusing to promote"
            exit 1
          fi

          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET:0:7}" >> "$GITHUB_OUTPUT"
          echo "Target SHA: $TARGET ($(git log -1 --format=%s "$TARGET"))"

      - name: Verify CI passed on target SHA
        id: ci_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name }}
        run: |
          set -euo pipefail
          TARGET="${{ steps.target.outputs.sha }}"
          # `gh api --jq` runs jq but doesn't accept `--arg`, so pipe the raw
          # JSON to standalone jq with the workflow name passed safely as a
          # jq variable (the caller's CI workflow may not be named "CI").
          # per_page=100 so the matching CI run can't fall off the default
          # first page on a SHA with many workflow runs (re-runs, many workflows).
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${TARGET}&status=success&per_page=100" \
            | jq --arg name "$CI_WORKFLOW_NAME" '[.workflow_runs[] | select(.name == $name)] | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No successful '${CI_WORKFLOW_NAME}' run found for ${TARGET:0:7} — has it completed on main?"
            exit 1
          fi
          echo "'${CI_WORKFLOW_NAME}' passed on ${TARGET:0:7} ($COUNT successful run(s))"

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Verify image exists in DOCR
        id: image_check
        # Done here (not at deploy time) so we fail BEFORE FF-pushing to
        # production — otherwise we'd advance production to a SHA the deploy
        # can't roll out.
        uses: sidekick-labs/.github/.github/actions/docr-image-exists@v3  # moving release tag — see #1/v3
        with:
          image_repo: ${{ inputs.image_repo }}
          tag: ${{ steps.target.outputs.sha }}
          registry: ${{ inputs.registry }}

      - name: Check production app id is configured
        id: app_check
        run: |
          if [ -z "$DO_PRODUCTION_APP_ID" ]; then
            echo "::error::do_production_app_id is empty — set vars.DO_PRODUCTION_APP_ID on the caller repo"
            exit 1
          fi
          echo "Production app id: $DO_PRODUCTION_APP_ID"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Dry run — would promote ${{ steps.target.outputs.short }} to production"
            echo
            echo "- Target SHA: \`${{ steps.target.outputs.sha }}\`"
            echo "- DOCR image: \`${IMAGE_REPO}:${{ steps.target.outputs.short }}\` ✓ exists"
            echo "- CI status on target: ✓ passing"
            echo "- App: \`$DO_PRODUCTION_APP_ID\`"
            echo
            echo "**Stopping before FF-push** (dry-run mode)."
          } > "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward production → target SHA
        id: ff_push
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          TARGET="${{ steps.target.outputs.sha }}"
          # Detect re-promote of an already-deployed SHA so the next step can
          # skip the redundant dispatch (~10-15 min DO re-apply). The plain
          # push itself is a no-op when production already points at TARGET.
          # Best-effort fetch first so the no-op detection is reliable even when
          # checkout didn't populate the tracking ref; tolerated-missing on the
          # first-ever release (production branch doesn't exist yet).
          git fetch --no-tags origin production:refs/remotes/origin/production 2>/dev/null || true
          PROD_SHA=$(git rev-parse refs/remotes/origin/production 2>/dev/null || echo "")
          # Old production tip (pre-push) — the Slack root composes the commit
          # range PROD_SHA..TARGET from it. Empty on the first-ever release.
          echo "prod_sha=$PROD_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$PROD_SHA" ] && [ "$PROD_SHA" = "$TARGET" ]; then
            echo "already_at_target=true" >> "$GITHUB_OUTPUT"
            echo "production already at ${TARGET:0:7} — push will be a no-op, dispatch will be skipped"
          else
            echo "already_at_target=false" >> "$GITHUB_OUTPUT"
          fi

          # Plain (non-`+`) push: refuses unless a true fast-forward. Branch
          # protection + the release-bot bypass preserve linear promotion
          # history. First-release case: this creates refs/heads/production.
          git push origin "${TARGET}:refs/heads/production"

      - name: Gather release PRs
        # Resolve the commit range PROD_SHA..TARGET into PR-linked Slack bullets
        # (link the PR when the squash commit maps to one; commit link as
        # fallback) plus an LLM input file for the summary step below. Only when
        # a thread will actually be opened.
        id: gather_prs
        if: ${{ !inputs.dry_run && success() && steps.ff_push.outputs.already_at_target != 'true' && inputs.slack_channel != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          TARGET: ${{ steps.target.outputs.sha }}
          PROD_SHA: ${{ steps.ff_push.outputs.prod_sha }}
        run: |
          set -uo pipefail
          if [ -n "$PROD_SHA" ] && git rev-parse --verify "$PROD_SHA" >/dev/null 2>&1; then
            SHAS=$(git log --no-merges --format='%H' "${PROD_SHA}..${TARGET}" 2>/dev/null)
            echo "first_note=" >> "$GITHUB_OUTPUT"
          else
            SHAS=$(git log --no-merges --format='%H' -n 15 "${TARGET}" 2>/dev/null)
            echo "first_note= _(first production release)_" >> "$GITHUB_OUTPUT"
          fi
          : > /tmp/release-bullets.txt   # Slack mrkdwn, one linked line per PR/commit
          : > /tmp/release-prs.txt       # LLM input: PR title + body excerpt
          COUNT=0; MAX=15
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            COUNT=$((COUNT+1))
            [ "$COUNT" -gt "$MAX" ] && continue
            # Capture the PR JSON once, then extract each field with jq. Do NOT
            # pack fields into a tab tuple: PR bodies contain newlines+tabs that
            # break `cut`, corrupting the number/title/url and leaking body text
            # (incl. tool footers) into the bullets. title/url are single-line;
            # body is explicitly flattened + footer-stripped + capped.
            J=$(gh api "repos/${REPO}/commits/${sha}/pulls" 2>/dev/null || echo '[]')
            NUM=$(printf '%s' "$J" | jq -r '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$NUM" ]; then
              TITLE=$(printf '%s' "$J" | jq -r '.[0].title // ""' 2>/dev/null)
              URL=$(printf '%s' "$J" | jq -r '.[0].html_url // ""' 2>/dev/null)
              BODY=$(printf '%s' "$J" | jq -r '.[0].body // ""' 2>/dev/null \
                | sed -E 's/(🤖|:robot_face:).*$//' \
                | tr '\n\t' '  ' | tr -s ' ' | cut -c1-200)
              printf '• <%s|#%s> %s\n' "$URL" "$NUM" "$TITLE" >> /tmp/release-bullets.txt
              printf -- '- #%s %s — %s\n' "$NUM" "$TITLE" "$BODY" >> /tmp/release-prs.txt
            else
              SUBJ=$(git log -1 --no-merges --format='%s' "$sha" 2>/dev/null)
              printf '• <%s/%s/commit/%s|%s> %s\n' "$SERVER" "$REPO" "$sha" "${sha:0:7}" "$SUBJ" >> /tmp/release-bullets.txt
              printf -- '- %s %s\n' "${sha:0:7}" "$SUBJ" >> /tmp/release-prs.txt
            fi
          done <<< "$SHAS"
          if [ "$COUNT" -gt "$MAX" ]; then
            printf '• …and %s more\n' "$((COUNT - MAX))" >> /tmp/release-bullets.txt
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Gathered $COUNT change(s) for the release root"

      - name: AI release summary
        # Best-effort human "what's shipping" blurb. continue-on-error + the
        # compose step's file check mean a missing token / failure / timeout
        # falls back to the linked PR list — never blocks the release. No
        # id-token granted: if the action needs OIDC it fails at runtime and is
        # caught here, rather than a permissions startup_failure.
        id: ai_summary
        if: ${{ !inputs.dry_run && success() && steps.ff_push.outputs.already_at_target != 'true' && inputs.slack_channel != '' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@fad22eb3fa582b7357fc0ea48af6645851b884fd # v1.0.161
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}
            --allowed-tools Read,Write
            --effort ${{ vars.CLAUDE_EFFORT || 'low' }}
          prompt: |
            /tmp/release-prs.txt lists the PRs/commits in this production release of `${{ inputs.image_repo }}`. Read it, then WRITE a concise "what's shipping" summary to /tmp/release-summary.md.

            Rules:
            - 2-4 short bullets or 2-3 sentences; under 80 words total.
            - Slack mrkdwn only: *single-asterisk bold*, `backticks` for identifiers. NEVER **double-asterisk** or `#` headings.
            - Describe operator/user-facing impact and themes in plain language. Do NOT restate PR titles verbatim and do NOT include PR numbers or links (listed separately).
            - No preamble, no closing line, no headings. If intent is unclear, write one neutral sentence.
            - Only write /tmp/release-summary.md. Do not run shell commands or modify anything else.

      - name: Compose release thread root
        # header + AI summary (when produced) + linked PR bullets + trigger line.
        # Falls back to just the linked bullets if the AI step produced nothing.
        id: slack_root_text
        if: ${{ !inputs.dry_run && success() && steps.ff_push.outputs.already_at_target != 'true' && inputs.slack_channel != '' }}
        env:
          IMAGE_REPO: ${{ inputs.image_repo }}
          ACTOR: ${{ github.actor }}
          SHORT: ${{ steps.target.outputs.short }}
          COUNT: ${{ steps.gather_prs.outputs.count }}
          FIRST_NOTE: ${{ steps.gather_prs.outputs.first_note }}
        run: |
          set -uo pipefail
          BULLETS=$(cat /tmp/release-bullets.txt 2>/dev/null || true)
          # GitHub-markdown → Slack mrkdwn. The AI summary is free-form and LLMs
          # default to GitHub markdown (**bold**, ## heads, - lists, [t](u)) which
          # Slack renders LITERALLY. Normalize so bold + bullets actually take.
          # (Bullets/header/links elsewhere are composed by us and already clean.)
          # Each sed expr in order: [t](u)→<u|t>; **b**→*b*; __b__→*b*; ~~s~~→~s~;
          # leading #-heading→*bold*; leading -/* list marker→• bullet.
          to_mrkdwn() {
            sed -E \
              -e 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' \
              -e 's/(^|[^*])\*\*([^*]+)\*\*/\1*\2*/g' \
              -e 's/(^|[^_])__([^_]+)__/\1*\2*/g' \
              -e 's/~~([^~]+)~~/~\1~/g' \
              -e 's/^[[:space:]]*#{1,6}[[:space:]]+(.*)$/*\1*/' \
              -e 's/^([[:space:]]*)[-*][[:space:]]+/\1• /'
          }
          SUMMARY=""
          if [ -s /tmp/release-summary.md ]; then
            SUMMARY=$(to_mrkdwn < /tmp/release-summary.md)
          else
            # Loud, not silent: this exact case (empty token → no summary) hid for
            # weeks. The root still posts (linked PR list), but flag it so a
            # broken token/timeout is visible in the Action log.
            echo "::warning::AI release summary produced no output (CLAUDE_CODE_OAUTH_TOKEN missing, or the step timed out/failed) — root will use the linked PR list only"
          fi
          {
            echo "text<<SLACK_EOF"
            printf '🚀 *Releasing `%s` to production*%s\n' "$IMAGE_REPO" "$FIRST_NOTE"
            [ -n "$SUMMARY" ] && printf '\n%s\n' "$SUMMARY"
            printf '\n*Changes* (`%s`, %s):\n%s\n' "$SHORT" "$COUNT" "$BULLETS"
            printf '\n_triggered by @%s · rollout starting, live updates below._\n' "$ACTOR"
            echo "SLACK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post release thread root
        id: slack_root
        if: ${{ !inputs.dry_run && success() && steps.ff_push.outputs.already_at_target != 'true' && inputs.slack_channel != '' }}
        uses: sidekick-labs/.github/.github/actions/slack-deploy-thread@v3  # moving release tag — see #1/v3
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ inputs.slack_channel }}
          mode: start
          text: ${{ steps.slack_root_text.outputs.text }}

      - name: Dispatch production deploy
        # The caller's deploy-production workflow only has workflow_dispatch,
        # and CI is scoped to [main], so nothing fires it implicitly — this is
        # the chain. Gated on already_at_target to avoid a redundant DO re-apply.
        #
        # Dispatch with the release-bot App token, NOT GITHUB_TOKEN. A run
        # created by GITHUB_TOKEN is subject to the "no recursive workflow runs"
        # guard, which suppresses the deploy's completion `workflow_run` event —
        # so post-deploy-triage (a workflow_run listener) never fires for a
        # production rollout, and the thread never gets a triage verdict. Runs
        # created by a GitHub App installation token are exempt from that guard.
        # workflow_dispatch itself is allowed for either token, so the deploy
        # still starts; only the downstream workflow_run differs.
        id: dispatch_deploy
        if: ${{ !inputs.dry_run && success() && steps.ff_push.outputs.already_at_target != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy_production_workflow }}
          # Empty unless the Slack root was posted. Only forwarded when set, so
          # this reusable stays compatible with callers that don't yet declare
          # the deploy workflow's `slack_thread_ts` input (passing an unknown
          # --field would 422 the dispatch *after* the FF-push — the one failure
          # mode we must avoid).
          #
          # Note: only the thread ts crosses the workflow boundary here. The
          # channel is NOT dispatched — each caller's deploy workflow configures
          # its own channel independently (vars.RELEASE_SLACK_CHANNEL_ID), so a
          # new service wires the channel on its deploy workflow, not via this
          # dispatch.
          THREAD_TS: ${{ steps.slack_root.outputs.thread_ts }}
        run: |
          set -euo pipefail
          ARGS=(--field ref="$SHA")
          if [ -n "$THREAD_TS" ]; then
            ARGS+=(--field slack_thread_ts="$THREAD_TS")
          fi
          # Record dispatch time (backdated 30s for clock skew) so the watchdog
          # below can identify the run THIS dispatch created.
          echo "dispatched_after=$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run "$DEPLOY_WORKFLOW" "${ARGS[@]}"
          echo "Dispatched $DEPLOY_WORKFLOW for ${SHA:0:7}${THREAD_TS:+ (thread ${THREAD_TS})}"

      - name: Confirm the deploy actually started
        # Safety net for the deploy thread: if the dispatched deploy never runs
        # (startup_failure from a bad workflow/permission, cancelled, or never
        # appears) NO step in it executes — so its `always()` summary never posts
        # and the #releases thread is orphaned at "Rollout starting…". The
        # deploy-that-RUNS-and-fails case is already covered by that summary; this
        # only catches the never-started case, which only promote can observe
        # (it holds the thread ts and knows it dispatched). Best-effort + bounded.
        id: watchdog
        if: ${{ !inputs.dry_run && steps.ff_push.outputs.already_at_target != 'true' && steps.slack_root.outputs.thread_ts != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy_production_workflow }}
          SINCE: ${{ steps.dispatch_deploy.outputs.dispatched_after }}
        run: |
          set -uo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          DEADLINE=$(( $(date +%s) + 150 ))   # ~2.5 min; the run appears in seconds
          FAILED_TO_START=1; RUN_URL=""; CONCLUSION="never_appeared"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RUN=$(gh run list --workflow="$DEPLOY_WORKFLOW" --limit 5 \
              --json databaseId,status,conclusion,createdAt,url \
              --jq "[.[] | select(.createdAt >= \"$SINCE\")] | sort_by(.createdAt) | last // empty" 2>/dev/null || echo "")
            if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then sleep 10; continue; fi
            STATUS=$(echo "$RUN" | jq -r '.status'); CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // ""'); RUN_URL=$(echo "$RUN" | jq -r '.url')
            case "$STATUS" in
              completed)
                # success or a normal `failure` (its own always() summary posts) →
                # the deploy owns the thread, nothing for us to do. Only
                # startup_failure / cancelled ran NO steps → report.
                case "$CONCLUSION" in
                  startup_failure|cancelled) FAILED_TO_START=1 ;;
                  *) FAILED_TO_START=0 ;;
                esac
                break ;;
              in_progress|requested|waiting|pending)
                FAILED_TO_START=0; break ;;     # it's running → deploy owns the thread
              *) sleep 8 ;;                       # queued / unknown — keep waiting
            esac
          done
          emit failed_to_start "$FAILED_TO_START"
          emit run_url "$RUN_URL"
          emit conclusion "$CONCLUSION"
          [ "$FAILED_TO_START" = "1" ] && echo "::warning::Dispatched deploy did not start (conclusion=$CONCLUSION) — reporting to the deploy thread"
          exit 0

      - name: Compose failed-to-start thread reply
        id: watchdog_text
        if: ${{ steps.watchdog.outputs.failed_to_start == 'true' }}
        env:
          SHORT: ${{ steps.target.outputs.short }}
          CONCLUSION: ${{ steps.watchdog.outputs.conclusion }}
          RUN_URL: ${{ steps.watchdog.outputs.run_url }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy_production_workflow }}
        run: |
          set -uo pipefail
          LINK=""
          [ -n "$RUN_URL" ] && LINK=" — <${RUN_URL}|deploy run>"
          TEXT="❌ *Production deploy failed to start* (\`${CONCLUSION}\`)${LINK}"$'\n'"\`production\` is at \`${SHORT}\` but the rollout did NOT run — no live updates will follow. Re-dispatch \`${DEPLOY_WORKFLOW}\` (with this thread's ts) once the cause is fixed."
          {
            echo "text<<WD_EOF"
            printf '%s\n' "$TEXT"
            echo "WD_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report failed-to-start into the deploy thread
        if: ${{ steps.watchdog.outputs.failed_to_start == 'true' }}
        uses: sidekick-labs/.github/.github/actions/slack-deploy-thread@v3  # moving release tag — see #1/v3
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ inputs.slack_channel }}
          mode: reply
          thread_ts: ${{ steps.slack_root.outputs.thread_ts }}
          text: ${{ steps.watchdog_text.outputs.text }}

      - name: Summary
        if: ${{ !inputs.dry_run && success() }}
        env:
          DEPLOY_RUNS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/${{ inputs.deploy_production_workflow }}
          ALREADY_AT_TARGET: ${{ steps.ff_push.outputs.already_at_target }}
        run: |
          {
            echo "## ✅ Promoted \`${{ steps.target.outputs.short }}\` to production"
            echo
            echo "- SHA: \`${{ steps.target.outputs.sha }}\`"
            if [ "$ALREADY_AT_TARGET" = "true" ]; then
              echo "- Production branch was **already at this SHA** — push was a no-op."
              echo "- Production deploy was **not** dispatched (would have been a redundant re-apply)."
            else
              echo "- Production branch advanced."
              echo "- Production deploy dispatched — watch the rollout there."
              echo
              echo "[Production deploy runs →]($DEPLOY_RUNS_URL)"
            fi
          } > "$GITHUB_STEP_SUMMARY"

      - name: Classify failure stage
        id: stage
        if: failure()
        run: |
          if [ "${{ steps.app_token.outcome }}" = "failure" ]; then
            STAGE="GitHub App token mint (release_bot_client_id / RELEASE_BOT_PRIVATE_KEY missing/invalid, or App not installed)"
          elif [ "${{ steps.checkout.outcome }}" = "failure" ]; then
            STAGE="repository checkout"
          elif [ "${{ steps.target.outcome }}" = "failure" ]; then
            STAGE="target SHA resolution / ancestor check"
          elif [ "${{ steps.ci_check.outcome }}" = "failure" ]; then
            STAGE="CI gate (no successful CI run on target SHA)"
          elif [ "${{ steps.image_check.outcome }}" = "failure" ]; then
            STAGE="DOCR image-existence check (staging deploy missing for this SHA?)"
          elif [ "${{ steps.app_check.outcome }}" = "failure" ]; then
            STAGE="production app id check (do_production_app_id unset?)"
          elif [ "${{ steps.ff_push.outcome }}" = "failure" ]; then
            STAGE="fast-forward push to production branch (non-FF history, or release-bot App missing from production ruleset bypass list?)"
          elif [ "${{ steps.dispatch_deploy.outcome }}" = "failure" ]; then
            STAGE="dispatching production deploy (production branch advanced but deploy never started — manual dispatch may be needed; if the dispatch 403'd, the release-bot App install may need re-approval for Actions:write)"
          else
            STAGE="environment setup (doctl install, registry auth, …)"
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Comment on merged PR when promote fails
        if: failure()
        uses: sidekick-labs/.github/.github/actions/deploy-failure-comment@v3  # moving release tag — see #1/v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ steps.target.outputs.sha }}
          title: Production PROMOTE failed
          stage: ${{ steps.stage.outputs.stage }}
          log_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          footer: "Production has NOT been updated. The promote step is what writes to refs/heads/production; nothing downstream of it has run."
