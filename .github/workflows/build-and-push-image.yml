name: Build and Push Docker Image to DOCR

on:
  workflow_call:
    inputs:
      context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile'
        required: true
        type: string
      image_name:
        description: 'Image name in DOCR (e.g., sidekick-web-base)'
        required: true
        type: string
      tags:
        description: 'Comma-separated image tags (e.g., ruby-3.4.4,latest)'
        required: true
        type: string
      build_args:
        description: |
          Docker build arguments (multiline, KEY=VALUE format).
          ⚠️  DO NOT pass secrets via build_args — they are stored in image
          metadata (visible via `docker history --no-trunc`). Use
          `build_secrets` below for anything that must not leak.
        required: false
        type: string
        default: ''
      build_secrets:
        description: |
          BuildKit secrets passed to the build (multiline, KEY=VALUE format).
          Mounted only during build, never written to image layers or metadata.
          Reference inside the Dockerfile with `RUN --mount=type=secret,id=KEY ...`.
        required: false
        type: string
        default: ''
      registry:
        description: 'DOCR registry name'
        required: false
        type: string
        default: 'sidekick-labs'
      timeout:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 20
      free_disk_space:
        description: |
          Reclaim the ~20+ GB of preinstalled tooling (Android SDK, .NET, GHC,
          CodeQL, …) on the ubuntu-latest runner BEFORE building. Off by default
          — it adds ~1-2 min, only worth it for large images. Turn it on when a
          build fails with a killed "Build and push image" step and no error
          (the runner's ~14 GB free disk exhausted mid-build): e.g.
          sidekick-inference's perception image is 7.25 GB with a 4.48 GB
          install layer + 2.8 GB of baked model weights, which no longer fits.
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    name: Build & Push ${{ inputs.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}

    steps:
      # Runs first, before any layer is pulled, so the reclaimed space is
      # available for the whole build. Opt-in — see the input description.
      - name: Free up disk space
        if: ${{ inputs.free_disk_space }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # Toolchains only — keep the swap and the (fast) docker image cache so
          # the build itself isn't slowed. This alone frees ~20+ GB.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
          docker-images: false

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate image tags
        id: tags
        env:
          INPUT_TAGS: ${{ inputs.tags }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE: ${{ inputs.image_name }}
        run: |
          FULL_REGISTRY="registry.digitalocean.com/${REGISTRY}"
          TAGS=""
          IFS=',' read -ra TAG_ARRAY <<< "$INPUT_TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            tag=$(echo "$tag" | xargs)
            if [ -n "$TAGS" ]; then
              TAGS="${TAGS}"$'\n'
            fi
            TAGS="${TAGS}${FULL_REGISTRY}/${IMAGE}:${tag}"
          done
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Deliberately the LAST step before the build, and deliberately derived
      # from the job's own timeout budget rather than a fixed number.
      #
      # This was `--expiry-seconds 1200` — exactly 20 minutes — while the
      # perception-image caller (sidekick-inference build-perception.yml) passes
      # `timeout: 40`. A ~7.25 GB image routinely takes longer than the token
      # lived, and because docker/build-push-action builds AND pushes in a single
      # action invocation, the credential minted before the build is the one the
      # blob upload has to use at the end. It expired mid-push:
      #
      #   ERROR: failed to build: failed to solve: failed to fetch oauth token:
      #   unexpected status from GET request to
      #   https://api.digitalocean.com/v2/registry/auth?...: 401 Unauthorized
      #
      # Measured on this step: failures at 33.2 / 28.3 / 22.8 / 22.4 min,
      # successes at 14.3 / 10.8 min. Every failure crossed 20 minutes; every
      # success came in under it. (sidekick-labs/sre-brain#400)
      #
      # Why the credential lifetime and not a re-login: there is no seam to
      # re-authenticate in. Build and push are one step, so a "log in again just
      # before pushing" step cannot exist without splitting the action. Moving
      # this step to sit immediately before the build reclaims the buildx-setup
      # and tag-generation time, but that is a minute or two — only a credential
      # that outlives the whole build actually fixes it.
      #
      # `timeout + 15` minutes bounds it by the thing that already bounds the
      # job: if the credential outlives the job timeout, it cannot expire while
      # the job is still running, and the failure mode becomes a clean timeout
      # instead of a confusing 401. The 30-minute floor covers callers that
      # leave the default. DOCR's documented ceiling is 1576800000s (~50 years;
      # the API rejects 1576800001 with "cannot set an expiration greater than
      # 50 years"), and GitHub caps a job at 6 hours (21600s), so any value we
      # can reach here is orders of magnitude inside the limit.
      - name: Log in to DOCR
        env:
          JOB_TIMEOUT_MINUTES: ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          EXPIRY=$(( (JOB_TIMEOUT_MINUTES + 15) * 60 ))
          if [ "$EXPIRY" -lt 1800 ]; then EXPIRY=1800; fi
          echo "Minting DOCR credentials valid for ${EXPIRY}s (job timeout ${JOB_TIMEOUT_MINUTES}m)."
          doctl registry login --expiry-seconds "$EXPIRY"

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ inputs.build_args }}
          secrets: ${{ inputs.build_secrets }}
          cache-from: type=registry,ref=registry.digitalocean.com/${{ inputs.registry }}/${{ inputs.image_name }}:latest
          cache-to: type=inline
