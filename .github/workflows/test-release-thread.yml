name: Test release-thread logic

# Runs the regression tests for the bash logic embedded in the production
# release reusables: the `to_mrkdwn` normalizer + gather_prs construction
# (release-thread-logic.sh), the GitHub Deployment STATE decision +
# do-app-deploy EXIT-trap phase guarantee (deployment-status-logic.sh), and
# do-app-deploy's outcome-based reconciliation poll loop
# (do-app-deploy-reconcile-logic.sh), and the post-deploy triage DO-log fetch
# gate (do-log-fetch-gate-logic.sh).
# Several of these shipped bugs to live releases before these tests existed.
#
# The DO-log gate tests read step names out of reusable-deploy-staging.yml and
# reusable-deploy-production.yml, so both are path triggers here: renaming a
# deploy-gate step must fail this workflow rather than silently switching off
# DO log fetching in triage.
on:
  pull_request:
    paths:
      - '.github/workflows/reusable-promote-production.yml'
      - '.github/workflows/reusable-deploy-production.yml'
      - '.github/actions/slack-deploy-thread/**'
      - '.github/actions/do-app-deploy/**'
      - '.github/actions/gh-deployment-finish/**'
      - '.github/tests/release-thread-logic.sh'
      - '.github/tests/deployment-status-logic.sh'
      - '.github/tests/do-app-deploy-reconcile-logic.sh'
      - '.github/workflows/reusable-deploy-staging.yml'
      - '.github/actions/fetch-do-deploy-logs/**'
      - '.github/tests/do-log-fetch-gate-logic.sh'
      - '.github/workflows/test-release-thread.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/reusable-promote-production.yml'
      - '.github/workflows/reusable-deploy-production.yml'
      - '.github/actions/slack-deploy-thread/**'
      - '.github/actions/do-app-deploy/**'
      - '.github/actions/gh-deployment-finish/**'
      - '.github/tests/release-thread-logic.sh'
      - '.github/tests/deployment-status-logic.sh'
      - '.github/tests/do-app-deploy-reconcile-logic.sh'
      - '.github/workflows/reusable-deploy-staging.yml'
      - '.github/actions/fetch-do-deploy-logs/**'
      - '.github/tests/do-log-fetch-gate-logic.sh'
      - '.github/workflows/test-release-thread.yml'

permissions:
  contents: read

jobs:
  release-thread-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Run release-thread logic tests
        run: bash .github/tests/release-thread-logic.sh
      - name: Run deployment-status logic tests
        run: bash .github/tests/deployment-status-logic.sh
      - name: Run do-app-deploy reconcile logic tests
        run: bash .github/tests/do-app-deploy-reconcile-logic.sh
      - name: Run DO-log fetch gate logic tests
        run: bash .github/tests/do-log-fetch-gate-logic.sh
