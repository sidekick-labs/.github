name: estate-check

# Reusable agent-config lint (rarebit-one/estate-check): instruction-file budgets,
# permission bypasses, CI agent-step hygiene, MCP pinning, machine-local paths.
# It runs with the caller's own read-only token, so no cross-org credential is involved.
#
# Consume from a repo:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     schedule:
#       - cron: "23 2 * * 1"
#   permissions:
#     contents: read
#   jobs:
#     estate-check:
#       uses: <org>/.github/.github/workflows/estate-check.yml@main
#       with:
#         mode: report   # switch to enforce (and make the check required) once clean
#
# Bump the pinned action here, once per org, and every caller follows.

on:
  workflow_call:
    inputs:
      mode:
        description: "report (annotate, never fail) or enforce (fail on any error finding)"
        type: string
        default: report
      workspace:
        description: "true when the repo is an org workspace root (workspace-config): tighter budgets"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  estate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rarebit-one/estate-check@4c19f6e7db0424a30262d493dc3336374ed6064a # v1.1.0
        with:
          mode: ${{ inputs.mode }}
          workspace: ${{ inputs.workspace }}
