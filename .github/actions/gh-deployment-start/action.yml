name: Start GitHub Deployment
description: >-
  Create a GitHub Deployment for a commit SHA and immediately mark it
  in_progress. Extracted from the "Create GitHub Deployment" + "Mark deployment
  in_progress" steps duplicated across the staging and production deploy
  reusables. Returns the deployment id for the matching gh-deployment-finish
  step to post a terminal status against.

  `github.repository`/`github.run_id`/`github.server_url` resolve to the
  workflow run's repo (the app repo when invoked from a reusable workflow), so
  the deployment is created on the right repository automatically. The token is
  passed in (composite actions can't read `secrets.*`).

inputs:
  github_token:
    description: "Token with `deployments: write` on the target repo (usually secrets.GITHUB_TOKEN)."
    required: true
  environment:
    description: GitHub Environment name (e.g. staging / production).
    required: true
  sha:
    description: Commit SHA to deploy.
    required: true
  production_environment:
    description: '"true" for production environments, "false" otherwise. Parsed as a JSON boolean.'
    required: false
    default: "false"
  description:
    description: Human-readable deployment description.
    required: false
    default: ""
  log_url:
    description: Log URL for the in_progress status. Defaults to this workflow run.
    required: false
    default: ""

outputs:
  deployment_id:
    description: The created GitHub Deployment id.
    value: ${{ steps.create.outputs.deployment_id }}

runs:
  using: composite
  steps:
    - name: Create GitHub Deployment
      id: create
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ENVIRONMENT: ${{ inputs.environment }}
        SHA: ${{ inputs.sha }}
        PROD_ENV: ${{ inputs.production_environment }}
        DESCRIPTION: ${{ inputs.description }}
      run: |
        # NOT `set -e`. It was, and that made this step fail SILENTLY: a non-zero
        # jq or gh inside a command substitution killed the step BEFORE the
        # `::error::` guard below could run, so the guard was unreachable for
        # every likely failure mode and only fired on the one that never happens
        # (HTTP 200 carrying an empty id). A real failure on sidekick-web
        # produced a 0.34s step with no jq error, no gh error, and no `::error::`
        # line at all — undiagnosable from the log. See sre-brain#417.
        set -uo pipefail
        DESC="${DESCRIPTION:-Deploy for $SHA}"

        # `required_contexts` must be a JSON array and `production_environment`
        # a JSON boolean, so build the body with jq and pipe it to gh.
        # PROD_ENV is echoed QUOTED on failure: an empty value and a literal
        # `false` are the two candidates here and they must be distinguishable.
        if ! BODY=$(jq -n \
          --arg ref "$SHA" \
          --arg env "$ENVIRONMENT" \
          --argjson prod "$PROD_ENV" \
          --arg desc "$DESC" \
          '{ref: $ref, environment: $env, production_environment: $prod, auto_merge: false, required_contexts: [], description: $desc}' 2>&1); then
          echo "::error::Failed to build the deployment payload (production_environment='${PROD_ENV}', environment='${ENVIRONMENT}'): ${BODY}"
          exit 1
        fi

        # RETRY on failure. This step is deployment TRACKING, but a failure here
        # aborts the whole deploy before the rollout — so a transient blip on the
        # Deployments API stops an image reaching staging. That is backwards, and
        # it happened twice on sidekick-web (sre-brain#417) with a green retry
        # immediately after, which is the signature of a transient.
        #
        # Retrying is preferred over `continue-on-error`: it keeps the deployment
        # RECORD (which gh-deployment-finish needs, and which is the point of the
        # step) instead of silently proceeding without one. Semantics are
        # unchanged — a persistent failure still fails the step, loudly.
        #
        # Capture the WHOLE response rather than projecting with `--jq .id`, so a
        # 4xx/5xx body (the actual reason) survives into the log instead of being
        # thrown away by the projection.
        DEPLOY_ID=""
        for attempt in 1 2 3; do
          if RESP=$(echo "$BODY" | gh api "repos/${{ github.repository }}/deployments" \
            --method POST --input - 2>&1); then
            DEPLOY_ID=$(echo "$RESP" | jq -r '.id // empty' 2>/dev/null || true)
            [ -n "$DEPLOY_ID" ] && break
            echo "::warning::Deployments API returned no id on attempt ${attempt}/3. Response: ${RESP}"
          else
            echo "::warning::Deployments API call failed on attempt ${attempt}/3: ${RESP}"
          fi
          # No sleep after the final attempt — it would just pad the step.
          [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
        done

        if [ -z "$DEPLOY_ID" ]; then
          echo "::error::Failed to create a GitHub Deployment after 3 attempts. Last response: ${RESP}"
          exit 1
        fi
        echo "deployment_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
        echo "Created GitHub Deployment $DEPLOY_ID"

    - name: Mark deployment in_progress
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ENVIRONMENT: ${{ inputs.environment }}
        LOG_URL: ${{ inputs.log_url }}
      run: |
        # Same reasoning as the step above — report the API's own error instead
        # of dying on `set -e` with an empty log, and retry a transient rather
        # than aborting a deploy over a tracking blip (sre-brain#417).
        set -uo pipefail
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        OK=""
        for attempt in 1 2 3; do
          if RESP=$(gh api "repos/${{ github.repository }}/deployments/${{ steps.create.outputs.deployment_id }}/statuses" \
            -f state="in_progress" \
            -f environment="$ENVIRONMENT" \
            -f description="Deploy started" \
            -f log_url="${LOG_URL:-$RUN_URL}" 2>&1); then
            OK="yes"
            break
          fi
          echo "::warning::Marking deployment in_progress failed on attempt ${attempt}/3: ${RESP}"
          [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
        done

        if [ -z "$OK" ]; then
          echo "::error::Failed to mark deployment ${{ steps.create.outputs.deployment_id }} in_progress after 3 attempts. Last response: ${RESP}"
          exit 1
        fi
