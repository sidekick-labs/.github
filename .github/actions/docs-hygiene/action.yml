# The docs-hygiene gate as a composite action. Consumers normally reach it via
# the reusable workflows (docs-hygiene.yml for PRs, docs-hygiene-drift.yml for
# the weekly report), which check out the caller first. It lives in an action,
# not inline in the workflow, so the script ships with its fixtures: every run
# starts with `--self-test` against tests/fixtures/docs-hygiene/ in THIS repo.
#
# Spec: rule 5 of the docs-shape convention
# https://github.com/sidekick-labs/octo-brain/blob/main/.claude/conventions/docs-shape.md
#
# Exit contract (from the script): 0 clean / warn-only / drift report,
# 1 findings in block mode, 2 usage error, 3 UNKNOWN (could not tell). Every
# non-zero fails the step: an unreadable probe is never a clean bill of health.
name: Docs hygiene
description: >-
  Check CLAUDE.md / AGENTS.md / docs / .claude markdown against the docs-shape
  convention (links, backticked paths, frontmatter, index, orphans), or report
  docs whose `covers:` code changed after `verified:` (mode drift).
inputs:
  mode:
    description: '`warn` (findings annotate, never fail), `block` (findings fail), or `drift` (weekly report; needs fetch-depth 0).'
    required: false
    default: warn
  root:
    description: Repo root to check, relative to the workspace. Must be the top level of a git work tree.
    required: false
    default: '.'
  brain-repo:
    description: >-
      (mode drift) OWNER/NAME of the owning brain. When set, the report is also
      filed as ONE `docs-drift` issue there, refreshed in place each run and
      closed when drift reaches zero (drift-issue.mjs). Empty: step summary only.
    required: false
    default: ''
  issue-token:
    description: (mode drift) Token with issues:write on brain-repo. Empty means the issue is skipped with a warning (report-only).
    required: false
    default: ''
  dry-run:
    description: (mode drift) `true` prints the would-be issue (and, with a token, whether it would create/refresh/close) instead of writing.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'

    # The positive control. Runs before the real scan so a gate that can no
    # longer go red fails here instead of reporting a reassuring green.
    - name: Self-test (positive control)
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BRAIN_REPO: ${{ inputs.brain-repo }}
      run: |
        set -euo pipefail
        node "${GITHUB_ACTION_PATH}/docs-hygiene.mjs" --self-test
        if [ "$MODE" = drift ] && [ -n "$BRAIN_REPO" ]; then
          node "${GITHUB_ACTION_PATH}/drift-issue.mjs" --self-test
        fi

    - name: Docs hygiene (${{ inputs.mode }})
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ROOT: ${{ inputs.root }}
        # Composite steps stop at the first failure, so reaching this step
        # means the self-test above passed; the step summary says so.
        DOCS_HYGIENE_SELF_TESTED: '1'
      run: |
        set -uo pipefail
        case "$MODE" in
          warn)  flags=(--warn-only) ;;
          block) flags=() ;;
          drift) flags=(--drift --json-out "${RUNNER_TEMP}/docs-drift.json") ;;
          *) echo "::error title=docs-hygiene::mode must be warn, block or drift (got '${MODE}')"; exit 2 ;;
        esac
        node "${GITHUB_ACTION_PATH}/docs-hygiene.mjs" --root "$ROOT" "${flags[@]}"

    # Files the report in the owning brain. Report-only: drift-issue.mjs exits 0
    # on findings AND on its own filing failures (warnings), so only the scan
    # above (exit 3 = UNKNOWN) can fail a drift run.
    - name: File or refresh the brain issue
      if: inputs.mode == 'drift' && inputs.brain-repo != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.issue-token }}
        BRAIN_REPO: ${{ inputs.brain-repo }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        args=(--report "${RUNNER_TEMP}/docs-drift.json" --repo "$REPO" --brain "$BRAIN_REPO" --run-url "$RUN_URL")
        if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
        node "${GITHUB_ACTION_PATH}/drift-issue.mjs" "${args[@]}"
